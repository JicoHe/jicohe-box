<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos · Jico He</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        /* ---- Layout toggle buttons ---- */
        .layout-toggle {
            display: flex; gap: 0.3rem; margin-top: 0.8rem;
        }
        .layout-btn {
            font-family: var(--font-mono);
            font-size: 0.72rem; padding: 0.25rem 0.7rem;
            border: 1px solid var(--border); border-radius: 4px;
            background: var(--bg-soft); color: var(--text-muted);
            cursor: pointer; transition: all 0.15s ease;
        }
        .layout-btn:hover { border-color: var(--accent); color: var(--text); }
        .layout-btn.active {
            border-color: var(--accent); color: var(--accent);
            background: rgba(37, 99, 235, 0.06);
        }

        /* ---- Gallery: Masonry (default) ---- */
        .gallery {
            columns: 3 240px;
            column-gap: 0.8rem;
        }
        .gallery-item {
            break-inside: avoid;
            margin-bottom: 0.8rem;
            cursor: pointer;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: transform 0.2s cubic-bezier(0.23, 1, 0.32, 1),
                        filter 0.2s ease, opacity 0.2s ease;
        }
        @media (hover: hover) and (pointer: fine) {
            .gallery-item:hover { transform: scale(1.015); }
            .gallery-item:active { transform: scale(0.98); }
        }
        .gallery-item img {
            display: block; width: 100%; height: auto;
        }

        /* ---- Gallery: Grid mode ---- */
        .gallery.grid {
            columns: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.8rem;
        }
        .gallery.grid .gallery-item {
            margin-bottom: 0;
            aspect-ratio: 3/2;
        }
        .gallery.grid .gallery-item img {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        /* ---- Layout transition: blur-bridge (Emil Kowalski technique) ---- */
        .gallery.crossfading .gallery-item {
            filter: blur(2px);
            opacity: 0.7;
        }

        /* ---- Lightbox ---- */
        .lightbox {
            position: fixed; inset: 0; z-index: 200;
            display: none; align-items: center; justify-content: center;
        }
        .lightbox.active { display: flex; }
        .lightbox-bg {
            position: absolute; inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            animation: lb-fade 0.3s ease;
        }
        @keyframes lb-fade { from { opacity: 0; } to { opacity: 1; } }

        .lightbox-main {
            position: relative; z-index: 1;
            display: flex; align-items: center; gap: 0;
            max-width: 90vw; max-height: 85vh;
            animation: lb-zoom 0.35s cubic-bezier(0.23, 1, 0.32, 1);
        }
        @keyframes lb-zoom {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }
        .lightbox-main img {
            max-width: 100%; max-height: 85vh;
            border-radius: 12px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.4);
            display: block;
        }

        .lb-panel {
            position: absolute; right: -340px; top: 0;
            width: 320px; max-height: 85vh;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 16px 48px rgba(0,0,0,0.2);
            overflow-y: auto;
            display: none;
            animation: panel-in 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }
        @keyframes panel-in {
            from { opacity: 0; transform: translateX(-12px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .lb-panel.open { display: block; }
        .lb-panel h3 { font-size: 1rem; font-weight: 600; margin-bottom: 0.5rem; }
        .lb-meta {
            font-family: var(--font-mono);
            font-size: 0.72rem; color: var(--text-muted);
            margin-bottom: 1rem; line-height: 1.6;
        }
        .lb-meta span { display: block; }
        .lb-note {
            font-size: 0.88rem; color: var(--text-secondary);
            line-height: 1.7; white-space: pre-wrap;
        }

        .lb-toggle, .lb-download {
            position: absolute; right: -48px;
            width: 36px; height: 36px; border-radius: 50%;
            background: var(--bg);
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 1rem; color: var(--text-secondary);
            display: flex; align-items: center; justify-content: center;
            transition: border-color 0.15s ease, color 0.15s ease;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1); z-index: 2;
        }
        .lb-toggle { top: 50%; transform: translateY(-50%); }
        .lb-download { top: calc(50% + 44px); transform: translateY(-50%); }
        .lb-toggle:hover, .lb-download:hover { border-color: var(--accent); color: var(--accent); }

        .lb-close {
            position: absolute; top: -48px; right: 0;
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(255,255,255,0.12);
            border: none; cursor: pointer;
            font-size: 1.1rem; color: #fff;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s ease; z-index: 3;
        }
        .lb-close:hover { background: rgba(255,255,255,0.22); }

        .lb-arrow {
            position: absolute; top: 50%; z-index: 2;
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.15);
            cursor: pointer;
            font-size: 1.2rem; color: #fff;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s ease;
            transform: translateY(-50%);
        }
        .lb-arrow:hover { background: rgba(255,255,255,0.22); }
        .lb-arrow.prev { left: -60px; }
        .lb-arrow.next { right: -60px; }

        @media (max-width: 900px) {
            .lightbox-main { flex-direction: column; }
            .lb-panel {
                position: relative; right: auto; top: auto;
                width: 100%; max-height: 30vh; margin-top: 0.8rem;
                border-radius: 12px;
            }
            .lb-toggle { right: 8px; top: 8px; transform: none; }
            .lb-download { right: 8px; top: 52px; transform: none; }
            .lb-close { top: 8px; right: 52px; }
            .lb-arrow.prev { left: 8px; }
            .lb-arrow.next { right: 52px; }
            .gallery { columns: 2 160px; }
            .gallery.grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-left">
            <a href="/" class="nav-name">Jico He</a>
            <div class="nav-links">
<a href="/" class="nav-link"><span data-lang="zh">关于</span><span data-lang="en">About</span></a>
<a href="/reading/" class="nav-link"><span data-lang="zh">阅读</span><span data-lang="en">Reading</span></a>
<a href="/photos/" class="nav-link active"><span data-lang="zh">照片</span><span data-lang="en">Photos</span></a>
<a href="/now/" class="nav-link"><span data-lang="zh">此刻</span><span data-lang="en">Now</span></a>

        <div class="nav-right">
            <button class="nav-btn on" id="lang-zh" onclick="setLang('zh')">中</button>
            <button class="nav-btn" id="lang-en" onclick="setLang('en')">EN</button>
            <span class="nav-divider"></span>
            <button class="nav-btn" onclick="toggleTheme()" id="theme-btn">深色</button>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1><span data-lang="zh">照片</span><span data-lang="en">Photos</span></h1>
            <p class="page-desc">
                <span data-lang="zh">点击查看大图和笔记。</span>
                <span data-lang="en">Click to view full size and notes.</span>
            </p>
            <div class="layout-toggle">
                <button class="layout-btn active" id="btn-masonry" onclick="setLayout('masonry')">
                    <span data-lang="zh">瀑布流</span><span data-lang="en">Masonry</span>
                </button>
                <button class="layout-btn" id="btn-grid" onclick="setLayout('grid')">
                    <span data-lang="zh">网格</span><span data-lang="en">Grid</span>
                </button>
            </div>
        </div>

        <div class="gallery" id="gallery"></div>

        <footer>
            <span>&copy; 2026 Jico He</span>
            <span>built with Hermes Agent &middot; Cloudflare Pages</span>
            <div class="admin-dot" id="admin-dot" onclick="openAdmin()" title="管理">&#9670;</div>
        </footer>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-bg"></div>
        <div class="lightbox-main" id="lightbox-main">
            <button class="lb-close" onclick="closeLightbox()">&times;</button>
            <button class="lb-arrow prev" onclick="navLightbox(-1)">&#8249;</button>
            <img id="lb-img" src="" alt="">
            <button class="lb-toggle" id="lb-toggle" onclick="togglePanel()" title="信息">&#9432;</button>
            <a class="lb-download" id="lb-download" href="#" download title="下载">&#8595;</a>
            <button class="lb-arrow next" onclick="navLightbox(1)">&#8250;</button>
            <div class="lb-panel" id="lb-panel">
                <h3 id="lb-title"></h3>
                <div class="lb-meta" id="lb-meta"></div>
                <div class="lb-note" id="lb-note"></div>
            </div>
        </div>
    </div>

    <!-- Admin -->
    <div class="admin-overlay" id="admin-overlay">
        <div class="admin-modal" id="admin-modal">
            <div class="am-header"><h2><span data-lang="zh">管理入口</span><span data-lang="en">Admin</span></h2></div>
            <div class="am-body">
                <div class="pw-row">
                    <input type="password" id="pw-input" placeholder="密码…" autocomplete="off">
                    <button onclick="verifyPassword()"><span data-lang="zh">解锁</span><span data-lang="en">Unlock</span></button>
                </div>
                <div class="lock-msg" id="lock-msg"></div>
            </div>
            <div class="am-footer"><button class="am-close" onclick="closeAdmin()"><span data-lang="zh">&larr; 返回</span><span data-lang="en">&larr; Back</span></button></div>
        </div>
        <div class="admin-dashboard" id="admin-dashboard">
            <div class="dash-header"><span class="dash-title">Dashboard</span><button class="dash-close" onclick="closeDashboard()">&times;</button></div>
            <div class="service-grid">
                <a href="https://ha.jicohe-box.cn" target="_blank" class="service-card"><div class="s-title">HAOS</div><div class="s-desc">Home Assistant &rarr;</div></a>
                <div class="service-card"><div class="s-title">DeepSeek API</div><div class="token-num" id="ds-balance">&mdash;</div><div class="s-desc" id="ds-meta">&hellip;</div><button onclick="fetchBalance()" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:0.68rem;margin-top:0.15rem;font-family:inherit;">&#8635;</button></div>
                <a href="https://code.jicohe-box.cn" target="_blank" class="service-card"><div class="s-title">Code</div><div class="s-desc">VS Code &rarr;</div></a>
            </div>
            <div class="dash-actions">
                <button onclick="logoutAdmin()"><span data-lang="zh">退出登录</span><span data-lang="en">Log out</span></button>
            </div>
            <div class="dash-footer">Cloudflare Pages</div>
        </div>
    </div>

    <script>
        /* ================================================================
           PHOTO DATA — edit this array to add/change photos and notes.
           ================================================================ */
        var photos = [
            {
                file: "IMG_7243.jpeg",
                title: { zh: "IMG_7243", en: "IMG_7243" },
                date: "",
                camera: "",
                note: { zh: "^ 在这里写你的想法。", en: "^ Write your thoughts here." }
            },
            {
                file: "IMG_9523.jpeg",
                title: { zh: "IMG_9523", en: "IMG_9523" },
                date: "",
                camera: "",
                note: { zh: "^ 在这里写你的想法。", en: "^ Write your thoughts here." }
            },
            {
                file: "IMG_9687.jpeg",
                title: { zh: "IMG_9687", en: "IMG_9687" },
                date: "",
                camera: "",
                note: { zh: "^ 在这里写你的想法。", en: "^ Write your thoughts here." }
            }
        ];

        /* ---- Render gallery ---- */
        var gallery = document.getElementById("gallery");
        photos.forEach(function(photo, i) {
            var item = document.createElement("div");
            item.className = "gallery-item";
            item.onclick = function() { openLightbox(i); };
            var img = document.createElement("img");
            img.src = photo.file;
            img.alt = photo.title.zh;
            img.loading = "lazy";
            item.appendChild(img);
            gallery.appendChild(item);
        });

        /* ---- Layout toggle (Emil Kowalski blur-crossfade technique) ---- */
        var currentLayout = "masonry";
        function setLayout(mode) {
            if (mode === currentLayout) return;
            currentLayout = mode;

            // Step 1: blur + fade out
            gallery.classList.add("crossfading");

            // Step 2: swap layout class after blur settles
            setTimeout(function() {
                if (mode === "grid") {
                    gallery.classList.add("grid");
                } else {
                    gallery.classList.remove("grid");
                }
                // Force reflow so the new layout renders under blur
                gallery.offsetHeight;

                // Step 3: fade back in
                gallery.classList.remove("crossfading");
            }, 180);

            // Toggle active buttons
            document.getElementById("btn-masonry").classList.toggle("active", mode === "masonry");
            document.getElementById("btn-grid").classList.toggle("active", mode === "grid");

            // Persist preference
            localStorage.setItem("photo-layout", mode);
        }

        // Restore saved layout
        (function() {
            var saved = localStorage.getItem("photo-layout");
            if (saved === "grid") {
                currentLayout = null; // so setLayout doesn't skip
                setLayout("grid");
            }
        })();

        /* ---- Lightbox ---- */
        var currentIndex = 0;
        var lightbox = document.getElementById("lightbox");

        function openLightbox(i) {
            currentIndex = i;
            showPhoto();
            lightbox.classList.add("active");
            document.body.style.overflow = "hidden";
        }

        function closeLightbox() {
            lightbox.classList.remove("active");
            document.body.style.overflow = "";
            document.getElementById("lb-panel").classList.remove("open");
        }

        function navLightbox(dir) {
            currentIndex = (currentIndex + dir + photos.length) % photos.length;
            showPhoto();
        }

        function showPhoto() {
            var p = photos[currentIndex];
            var zh = document.documentElement.lang === "zh";
            document.getElementById("lb-img").src = p.file;
            document.getElementById("lb-img").alt = zh ? p.title.zh : p.title.en;
            document.getElementById("lb-title").textContent = zh ? p.title.zh : p.title.en;

            var meta = document.getElementById("lb-meta");
            var metaHtml = "";
            if (p.date) metaHtml += "<span>" + p.date + "</span>";
            if (p.camera) metaHtml += "<span>" + p.camera + "</span>";
            if (!metaHtml) metaHtml = "<span>" + (zh ? "暂无信息" : "No info yet") + "</span>";
            meta.innerHTML = metaHtml;

            document.getElementById("lb-note").textContent = zh ? p.note.zh : p.note.en;
            document.getElementById("lb-download").href = p.file;
        }

        function togglePanel() {
            document.getElementById("lb-panel").classList.toggle("open");
        }

        document.addEventListener("keydown", function(e) {
            if (!lightbox.classList.contains("active")) return;
            if (e.key === "Escape") closeLightbox();
            if (e.key === "ArrowLeft") navLightbox(-1);
            if (e.key === "ArrowRight") navLightbox(1);
            if (e.key === "i" || e.key === "I") togglePanel();
        });

        lightbox.querySelector(".lightbox-bg").addEventListener("click", closeLightbox);
    </script>
    <script src="/script.js"></script>
</body>
</html>
