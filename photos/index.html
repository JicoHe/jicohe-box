    <style>
        /* ---- Layout toggle buttons ---- */
        .layout-toggle {
            display: flex; gap: 0.3rem; margin-top: 0.8rem;
        }
        .layout-btn {
            font-family: var(--font-mono);
            font-size: 0.72rem; padding: 0.25rem 0.7rem;
            border: 1px solid var(--border); border-radius: 4px;
            background: var(--bg-soft); color: var(--text-muted);
            cursor: pointer; transition: all 0.15s ease;
        }
        .layout-btn:hover { border-color: var(--accent); color: var(--text); }
        .layout-btn.active {
            border-color: var(--accent); color: var(--accent);
            background: rgba(37, 99, 235, 0.06);
        }

        /* ---- Gallery: Masonry (default) ---- */
        .gallery {
            columns: 3 240px;
            column-gap: 0.8rem;
        }
        .gallery-item {
            break-inside: avoid;
            margin-bottom: 0.8rem;
            cursor: pointer;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: transform 0.2s cubic-bezier(0.23, 1, 0.32, 1),
                        filter 0.2s ease, opacity 0.2s ease;
        }
        @media (hover: hover) and (pointer: fine) {
            .gallery-item:hover { transform: scale(1.015); }
            .gallery-item:active { transform: scale(0.98); }
        }
        .gallery-item img {
            display: block; width: 100%; height: auto;
        }

        /* ---- Gallery: Grid mode ---- */
        .gallery.grid {
            columns: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.8rem;
        }
        .gallery.grid .gallery-item {
            margin-bottom: 0;
            aspect-ratio: 3/2;
        }
        .gallery.grid .gallery-item img {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        /* ---- Layout transition: blur-bridge (Emil Kowalski technique) ---- */
        .gallery.crossfading .gallery-item {
            filter: blur(2px);
            opacity: 0.7;
        }

        /* ---- Lightbox ---- */
        .lightbox {
            position: fixed; inset: 0; z-index: 200;
            display: none; align-items: center; justify-content: center;
        }
        .lightbox.active { display: flex; }
        .lightbox-bg {
            position: absolute; inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            transition: opacity 0.35s ease;
        }
        .lightbox.closing .lightbox-bg { opacity: 0; }

        .lightbox-main {
            position: relative; z-index: 1;
            display: flex; align-items: center; gap: 16px;
            max-width: 94vw; max-height: 88vh;
            animation: lb-in 0.35s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .lightbox.closing .lightbox-main {
            animation: lb-out 0.25s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }
        @keyframes lb-in {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes lb-out {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.94); }
        }

        .lb-image-wrap {
            position: relative;
            flex-shrink: 1; min-width: 0;
            display: inline-block;
        }
        .lightbox-main img {
            max-width: 100%; max-height: 85vh;
            border-radius: 12px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.4);
            display: block;
            transition: opacity 0.15s ease;
        }
        .lightbox-main img.switching { opacity: 0.35; }

        /* Panel: flex child, slides in from right */
        .lb-panel {
            width: 300px; max-height: 85vh; flex-shrink: 0;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 16px 48px rgba(0,0,0,0.25);
            overflow-y: auto;
            margin-right: -316px;
            opacity: 0;
            transform: translateX(24px);
            transition: margin-right 0.3s cubic-bezier(0.23, 1, 0.32, 1),
                        opacity 0.25s ease,
                        transform 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .lb-panel.open {
            margin-right: 0;
            opacity: 1;
            transform: translateX(0);
        }

        .lb-specs {
            font-family: var(--font-mono);
            font-size: 0.7rem; color: var(--text-muted);
            line-height: 1.75; margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .lb-specs .spec-row { display: flex; gap: 0.3rem; }
        .lb-specs .spec-label { color: var(--text-muted); min-width: 3.5em; }
        .lb-note-label {
            font-family: var(--font-mono);
            font-size: 0.65rem; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.06em;
            margin-bottom: 0.4rem;
        }
        .lb-note {
            font-size: 0.88rem; color: var(--text-secondary);
            line-height: 1.7; white-space: pre-wrap;
        }

        /* Buttons inside image */
        .lb-toggle, .lb-download {
            position: absolute; right: 12px;
            width: 34px; height: 34px; border-radius: 50%;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.15);
            cursor: pointer;
            font-size: 0.95rem; color: #fff;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s ease;
            z-index: 2;
        }
        .lb-toggle { top: 12px; }
        .lb-download { top: 52px; }
        .lb-toggle:hover, .lb-download:hover { background: rgba(0,0,0,0.55); }

        /* Arrows inside image wrapper, anchored to image */
        .lb-arrow {
            position: absolute; top: 50%; z-index: 2;
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.15);
            cursor: pointer;
            font-size: 1.2rem; color: #fff;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s ease;
            transform: translateY(-50%);
        }
        .lb-arrow:hover { background: rgba(0,0,0,0.55); }
        .lb-arrow.prev { left: 12px; }
        .lb-arrow.next { right: 12px; }

        /* Close: positioned above the image, part of the frame */
        .lb-close {
            position: absolute; top: -44px; right: 0;
            width: 34px; height: 34px; border-radius: 50%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            font-size: 1.05rem; color: #fff;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s ease; z-index: 3;
        }
        .lb-close:hover { background: rgba(0,0,0,0.6); }

        @media (max-width: 900px) {
            .lightbox-main img { max-width: 90vw; }
            .lb-panel {
                position: fixed; right: 0; top: auto; bottom: 0;
                width: 100%; max-height: 40vh;
                border-radius: 16px 16px 0 0; padding: 1.2rem;
                transform: translateY(100%);
            }
            .lb-panel.open { transform: translateY(0); }
            .lb-toggle { top: 8px; right: 8px; }
            .lb-download { top: 48px; right: 8px; }
            .lb-close { top: -40px; right: 0; }
            .lb-arrow { width: 34px; height: 34px; font-size: 1rem; }
            .lb-arrow.prev { left: 8px; }
            .lb-arrow.next { right: 8px; }
            .gallery { columns: 2 160px; }
            .gallery.grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>

    <script>
        /* ================================================================
           PHOTO DATA — edit this array to add/change photos and notes.
           ================================================================ */
        var photos = [
            {
                file: "IMG_7243.jpeg",
                specs: [
                    { zh: "机型", en: "Camera" },
                    { zh: "镜头", en: "Lens" },
                    { zh: "日期", en: "Date" },
                    { zh: "光圈", en: "Aperture" },

                ],
                values: [

                    "f/2.8",
                    "1/463s",
                    "ISO 32",
                    "9mm (77mm equiv.)"
                ],
                note: { zh: "^ 在这里写你的想法。", en: "^ Write your thoughts here." }
            },
            {
                file: "IMG_9523.jpeg",
                specs: [
                    { zh: "机型", en: "Camera" },
                    { zh: "镜头", en: "Lens" },
                    { zh: "日期", en: "Date" },
                    { zh: "光圈", en: "Aperture" },
                    { zh: "快门", en: "Shutter" },
                    { zh: "ISO", en: "ISO" },
                    { zh: "焦距", en: "Focal" }
                ],
                values: [
                    "iPhone 14 Pro",
                    "Back triple camera 6.86mm f/1.78",
                    "2025.07.15",
                    "f/1.8",
                    "1/5376s",
                    "ISO 100",
                    "7mm (24mm equiv.)"
                ],
                note: { zh: "^ 在这里写你的想法。", en: "^ Write your thoughts here." }
            },
            {
                file: "IMG_9687.jpeg",
                specs: [
                    { zh: "机型", en: "Camera" },
                    { zh: "镜头", en: "Lens" },
                    { zh: "日期", en: "Date" },
                    { zh: "光圈", en: "Aperture" },
                    { zh: "快门", en: "Shutter" },
                    { zh: "ISO", en: "ISO" },
                    { zh: "焦距", en: "Focal" }
                ],
                values: [
                    "iPhone 14 Pro",
                    "Back triple camera 6.86mm f/1.78",
                    "2025.07.16",
                    "f/1.8",
                    "1/11628s",
                    "ISO 100",
                    "7mm (24mm equiv.)"
                ],
                note: { zh: "^ 在这里写你的想法。", en: "^ Write your thoughts here." }
            }
        ];

        /* ---- Render gallery ---- */
        var gallery = document.getElementById("gallery");
        photos.forEach(function(photo, i) {
            var item = document.createElement("div");
            item.className = "gallery-item";
            item.onclick = function() { openLightbox(i); };
            var img = document.createElement("img");
            img.src = photo.file;
            img.alt = photo.file;
            img.loading = "lazy";
            item.appendChild(img);
            gallery.appendChild(item);
        });

        /* ---- Layout toggle (Emil Kowalski blur-crossfade technique) ---- */
        var currentLayout = "masonry";
        function setLayout(mode) {
            if (mode === currentLayout) return;
            currentLayout = mode;

            // Step 1: blur + fade out
            gallery.classList.add("crossfading");

            // Step 2: swap layout class after blur settles
            setTimeout(function() {
                if (mode === "grid") {
                    gallery.classList.add("grid");
                } else {
                    gallery.classList.remove("grid");
                }
                // Force reflow so the new layout renders under blur
                gallery.offsetHeight;

                // Step 3: fade back in
                gallery.classList.remove("crossfading");
            }, 180);

            // Toggle active buttons
            document.getElementById("btn-masonry").classList.toggle("active", mode === "masonry");
            document.getElementById("btn-grid").classList.toggle("active", mode === "grid");

            // Persist preference
            localStorage.setItem("photo-layout", mode);
        }

        // Restore saved layout
        (function() {
            var saved = localStorage.getItem("photo-layout");
            if (saved === "grid") {
                currentLayout = null; // so setLayout doesn't skip
                setLayout("grid");
            }
        })();

        /* ---- Lightbox ---- */
        var currentIndex = 0;
        var lightbox = document.getElementById("lightbox");

        function openLightbox(i) {
            currentIndex = i;
            var lb = document.getElementById("lightbox");
            lb.classList.remove("closing");
            showPhoto();
            lb.classList.add("active");
            document.body.style.overflow = "hidden";
        }

        function closeLightbox() {
            var lb = document.getElementById("lightbox");
            lb.classList.add("closing");
            document.getElementById("lb-panel").classList.remove("open");
            setTimeout(function() {
                lb.classList.remove("active", "closing");
                document.body.style.overflow = "";
            }, 250);
        }

        function navLightbox(dir) {
            currentIndex = (currentIndex + dir + photos.length) % photos.length;
            // Fade out, swap, fade in
            var img = document.getElementById("lb-img");
            img.classList.add("switching");
            setTimeout(function() {
                showPhoto();
                img.classList.remove("switching");
            }, 120);
        }

        function showPhoto() {
            var p = photos[currentIndex];
            var zh = document.documentElement.lang === "zh";
            document.getElementById("lb-img").src = p.file;
            document.getElementById("lb-img").alt = p.file;

            var specs = document.getElementById("lb-specs");
            var html = "";
            for (var i = 0; i < p.specs.length; i++) {
                html += '<div class="spec-row"><span class="spec-label">' + (zh ? p.specs[i].zh : p.specs[i].en) + '</span> ' + p.values[i] + '</div>';
            }
            specs.innerHTML = html;

            document.getElementById("lb-note").textContent = zh ? p.note.zh : p.note.en;
            document.getElementById("lb-download").href = p.file;
        }

        function togglePanel() {
            document.getElementById("lb-panel").classList.toggle("open");
        }

        document.addEventListener("keydown", function(e) {
            var lb = document.getElementById("lightbox");
            if (!lb.classList.contains("active") || lb.classList.contains("closing")) return;
            if (e.key === "Escape") closeLightbox();
            if (e.key === "ArrowLeft") navLightbox(-1);
            if (e.key === "ArrowRight") navLightbox(1);
            if (e.key === "i" || e.key === "I") togglePanel();
        });

        document.querySelector(".lightbox-bg").addEventListener("click", closeLightbox);
    </script>
    <script src="/script.js"></script>

</body>
