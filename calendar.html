<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日程 · 时间线 | Jico He.</title>
    <style>
        /* ═══════════════════════════════════════
           液态玻璃 · 设计系统
           ═══════════════════════════════════════ */

        :root {
            --bg-deep: #08080f;
            --glass-heavy: rgba(18, 18, 30, 0.55);
            --glass-medium: rgba(22, 22, 36, 0.45);
            --glass-light: rgba(30, 30, 48, 0.30);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-border-hover: rgba(255, 255, 255, 0.12);
            --glass-border-focus: rgba(255, 255, 255, 0.18);
            --text-primary: rgba(255, 255, 255, 0.92);
            --text-secondary: rgba(255, 255, 255, 0.55);
            --text-muted: rgba(255, 255, 255, 0.30);
            --accent-blue: #6d8cff;
            --accent-purple: #a78bfa;
            --accent-teal: #5eead4;
            --accent-red: #f87171;
            --accent-orange: #fb923c;
            --accent-green: #4ade80;
            --accent-yellow: #facc15;
            --blur-heavy: blur(80px) saturate(200%);
            --blur-medium: blur(40px) saturate(180%);
            --blur-light: blur(20px) saturate(160%);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-deep);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            position: relative;
        }

        /* 背景光斑 */
        .bg-blobs {
            position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
        }
        .blob {
            position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.18;
            animation-timing-function: ease-in-out; animation-iteration-count: infinite;
        }
        .blob-1 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, var(--accent-teal), transparent 70%);
            top: -10%; left: -10%;
            animation: float-blob-1 25s infinite alternate;
        }
        .blob-2 {
            width: 450px; height: 450px;
            background: radial-gradient(circle, var(--accent-purple), transparent 70%);
            bottom: -15%; right: -10%;
            animation: float-blob-2 28s infinite alternate;
        }
        @keyframes float-blob-1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 60px) scale(1.2); }
        }
        @keyframes float-blob-2 {
            0% { transform: translate(0, 0) scale(1.1); }
            100% { transform: translate(-70px, -80px) scale(0.9); }
        }

        .grain {
            position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        /* 玻璃组件 */
        .glass-panel {
            background: var(--glass-medium);
            backdrop-filter: var(--blur-medium);
            -webkit-backdrop-filter: var(--blur-medium);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
        }
        .glass-panel::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 50%, rgba(255,255,255,0.01) 100%);
            border-radius: inherit; pointer-events: none;
        }
        .glass-panel:hover {
            border-color: var(--glass-border-hover);
            box-shadow: 0 8px 40px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.04);
        }
        .glass-light {
            background: var(--glass-light);
            backdrop-filter: var(--blur-light);
            -webkit-backdrop-filter: var(--blur-light);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
        }

        /* 导航 */
        nav {
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 2rem;
            background: rgba(8, 8, 15, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--glass-border);
        }
        .nav-logo {
            font-weight: 700; font-size: 1.05rem; letter-spacing: -0.02em;
            color: var(--text-primary); text-decoration: none;
        }
        .nav-logo span { color: var(--accent-blue); }
        .nav-right { display: flex; gap: 0.5rem; align-items: center; }
        .nav-right a, .nav-right button {
            text-decoration: none; color: var(--text-secondary); font-size: 0.88rem;
            padding: 0.4rem 0.8rem; border-radius: 8px; transition: all 0.2s;
            cursor: pointer; border: none; background: none; font-family: inherit;
        }
        .nav-right a:hover, .nav-right button:hover {
            color: var(--text-primary); background: rgba(255,255,255,0.06);
        }

        /* 主容器 */
        .main-container {
            position: relative; z-index: 2;
            max-width: 820px; margin: 0 auto; padding: 2rem;
        }

        /* Header */
        .page-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;
        }
        .page-header h1 {
            font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em;
        }
        .page-header h1 span {
            background: linear-gradient(135deg, var(--accent-teal), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .update-time { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.3rem; }
        .header-actions { display: flex; gap: 0.5rem; }

        .btn-glass {
            padding: 0.6rem 1.2rem;
            background: var(--glass-light);
            backdrop-filter: var(--blur-light);
            -webkit-backdrop-filter: var(--blur-light);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.88rem; font-weight: 500;
            cursor: pointer; font-family: inherit;
            transition: all 0.3s;
        }
        .btn-glass:hover {
            border-color: var(--glass-border-hover);
            background: rgba(255,255,255,0.08);
        }
        .btn-accent {
            padding: 0.6rem 1.4rem;
            background: rgba(109, 140, 255, 0.15);
            border: 1px solid rgba(109, 140, 255, 0.25);
            border-radius: var(--radius-sm);
            color: var(--accent-blue);
            font-size: 0.88rem; font-weight: 600;
            cursor: pointer; font-family: inherit;
            transition: all 0.3s;
        }
        .btn-accent:hover {
            background: rgba(109, 140, 255, 0.25);
            border-color: rgba(109, 140, 255, 0.4);
        }

        /* 统计卡片 */
        .stats {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 0.75rem; margin-bottom: 2rem;
        }
        .stat {
            padding: 1.2rem; text-align: center;
        }
        .stat .num { font-size: 1.5rem; font-weight: 700; }
        .stat .lbl { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; }

        /* 时间线 */
        .day-group { display: flex; gap: 14px; margin-bottom: 0; }
        .rail {
            display: flex; flex-direction: column; align-items: center;
            width: 14px; flex-shrink: 0;
        }
        .rdot {
            width: 12px; height: 12px; border-radius: 50%;
            flex-shrink: 0; margin-top: 6px;
            box-shadow: 0 0 12px currentColor;
        }
        .rline {
            flex: 1; width: 1.5px;
            background: rgba(255,255,255,0.08);
            margin-top: 4px; min-height: 20px;
        }
        .day-content { flex: 1; padding-bottom: 0.5rem; }
        .day-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .day-pill {
            font-size: 0.78rem; font-weight: 600;
            padding: 3px 14px; border-radius: 20px; white-space: nowrap;
        }
        .day-label { font-size: 0.78rem; color: var(--text-muted); display: flex; gap: 4px; align-items: center; }

        .event-card {
            padding: 10px 14px; margin-bottom: 6px;
            display: flex; justify-content: space-between; align-items: center; gap: 12px;
            cursor: default;
            border-radius: var(--radius-sm);
        }
        .event-main { flex: 1; min-width: 0; }
        .event-title { font-size: 0.92rem; font-weight: 500; }
        .event-detail { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
        .event-time { font-size: 0.82rem; color: var(--text-secondary); white-space: nowrap; flex-shrink: 0; }
        .event-cal {
            font-size: 0.68rem; padding: 2px 8px; border-radius: 10px;
            white-space: nowrap; flex-shrink: 0; font-weight: 500;
        }

        /* Loading */
        .loading-state { text-align: center; padding: 4rem 2rem; color: var(--text-muted); }
        .spinner {
            display: inline-block; width: 24px; height: 24px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite; margin-bottom: 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; inset: 0; z-index: 200;
            background: rgba(4, 4, 8, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            align-items: center; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            width: 90%; max-width: 460px;
            padding: 2rem;
            animation: modal-in 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
        }
        @keyframes modal-in {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal h2 { font-size: 1.2rem; font-weight: 600; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label {
            display: block; font-size: 0.82rem; color: var(--text-secondary);
            margin-bottom: 0.35rem;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 0.7rem 0.9rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            color: var(--text-primary); font-size: 0.92rem; font-family: inherit;
            transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none; border-color: var(--glass-border-focus);
            box-shadow: 0 0 16px rgba(109, 140, 255, 0.08);
        }
        .form-row { display: flex; gap: 0.75rem; }
        .form-row .form-group { flex: 1; }
        .btn-submit {
            width: 100%; padding: 0.8rem;
            background: rgba(109, 140, 255, 0.15);
            border: 1px solid rgba(109, 140, 255, 0.25);
            border-radius: var(--radius-sm);
            color: var(--accent-blue); font-weight: 600; font-size: 0.95rem;
            cursor: pointer; font-family: inherit; margin-top: 0.5rem;
            transition: all 0.3s;
        }
        .btn-submit:hover {
            background: rgba(109, 140, 255, 0.25);
            border-color: rgba(109, 140, 255, 0.4);
        }
        .btn-cancel {
            width: 100%; padding: 0.6rem;
            background: transparent; border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            color: var(--text-muted); font-size: 0.88rem;
            cursor: pointer; font-family: inherit; margin-top: 0.5rem;
            transition: all 0.2s;
        }
        .btn-cancel:hover { border-color: var(--glass-border-hover); color: var(--text-secondary); }

        /* Toast */
        .toast {
            position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
            padding: 0.8rem 1.5rem; border-radius: var(--radius-sm);
            font-weight: 600; font-size: 0.88rem;
            z-index: 300; opacity: 0; transition: opacity 0.3s;
            pointer-events: none;
            background: var(--glass-medium);
            backdrop-filter: var(--blur-medium);
            -webkit-backdrop-filter: var(--blur-medium);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
        }
        .toast.show { opacity: 1; }

        footer {
            text-align: center; padding: 3rem 2rem;
            color: var(--text-muted); font-size: 0.82rem;
        }

        @media (max-width: 640px) {
            nav { padding: 1rem; }
            .main-container { padding: 1rem; }
            .stats { grid-template-columns: repeat(2, 1fr); }
            .page-header h1 { font-size: 1.3rem; }
            .form-row { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    <div class="grain"></div>

    <nav>
        <a href="/" class="nav-logo">个人<span>主义</span></a>
        <div class="nav-right">
            <a href="/">← 首页</a>
        </div>
    </nav>

    <div class="main-container">
        <div class="page-header">
            <div>
                <h1>📅 日程<span>时间线</span></h1>
                <div class="update-time" id="update-time">同步中…</div>
            </div>
            <div class="header-actions">
                <button class="btn-glass" onclick="loadCalendar()">🔄 刷新</button>
                <button class="btn-accent" onclick="openModal()">+ 新增日程</button>
            </div>
        </div>

        <div class="stats" id="stats"></div>
        <div id="timeline"><div class="loading-state"><div class="spinner"></div><p>加载日程中…</p></div></div>
    </div>

    <footer>个人主义 · 日程数据来自 iCloud 日历 · Cloudflare Pages</footer>

    <!-- Modal -->
    <div class="modal-overlay" id="modal">
        <div class="glass-panel modal">
            <h2>📋 新增日程</h2>
            <div class="form-group">
                <label>日程标题 *</label>
                <input type="text" id="ev-summary" placeholder="例如：团队会议">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>开始时间 *</label>
                    <input type="datetime-local" id="ev-start">
                </div>
                <div class="form-group">
                    <label>结束时间</label>
                    <input type="datetime-local" id="ev-end">
                </div>
            </div>
            <div class="form-group">
                <label>日历分类</label>
                <select id="ev-calendar">
                    <option value="">自动</option>
                    <option value="工作">工作</option>
                    <option value="Home">Home</option>
                    <option value="课程表">课程表</option>
                    <option value="自我">自我</option>
                    <option value="家庭">家庭</option>
                    <option value="考试">考试</option>
                </select>
            </div>
            <div class="form-group">
                <label>备注</label>
                <textarea id="ev-desc" rows="2" placeholder="可选"></textarea>
            </div>
            <button class="btn-submit" onclick="submitEvent()">提交日程</button>
            <button class="btn-cancel" onclick="closeModal()">取消</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        /* ═══════════════════════════════════════
           日历颜色映射
           ═══════════════════════════════════════ */
        const CAL_COLORS = {
            "工作":      { dot: "#FF6B6B", pill: "rgba(255,107,107,0.15)" },
            "课程表":    { dot: "#83D754", pill: "rgba(131,215,84,0.15)" },
            "考试":      { dot: "#FFCC00", pill: "rgba(255,204,0,0.15)" },
            "Home":      { dot: "#34AADC", pill: "rgba(52,170,220,0.15)" },
            "自我":      { dot: "#FF9500", pill: "rgba(255,149,0,0.15)" },
            "家庭":      { dot: "#5BC0EB", pill: "rgba(91,192,235,0.15)" },
            "Formula 1": { dot: "#e10600", pill: "rgba(225,6,0,0.15)" },
            "中国大陆节假日": { dot: "#FF9500", pill: "rgba(255,149,0,0.15)" },
            "Scheduled Reminders": { dot: "#5BC0EB", pill: "rgba(91,192,235,0.15)" },
        };
        const DEFAULT_COLOR = { dot: "#888888", pill: "rgba(136,136,136,0.15)" };

        function getCalStyle(name) {
            for (const [key, val] of Object.entries(CAL_COLORS)) {
                if (name && name.includes(key)) return val;
            }
            return DEFAULT_COLOR;
        }
        function getDotColor(name) { return getCalStyle(name).dot; }

        /* ═══════════════════════════════════════
           加载 & 渲染
           ═══════════════════════════════════════ */
        async function loadCalendar() {
            try {
                const resp = await fetch("/api/calendar");
                const data = await resp.json();
                render(data);
            } catch (err) {
                document.getElementById("timeline").innerHTML =
                    '<div class="loading-state"><p>⚠️ 无法加载日程数据</p><p style="font-size:0.78rem;margin-top:0.5rem;">请确保 sync_calendar.py 已在本地运行</p></div>';
            }
        }

        function render(data) {
            const events = data.events || [];
            document.getElementById("update-time").textContent =
                data.updated ? `最后同步: ${formatTime(data.updated)}` : "等待首次同步";

            const now = new Date();
            const todayStr = now.toISOString().split("T")[0];
            const upcoming = events.filter(e => e.start >= now.toISOString());
            const todayEvents = events.filter(e => e.start.startsWith(todayStr));
            document.getElementById("stats").innerHTML = `
                <div class="glass-panel stat"><div class="num" style="color:var(--accent-blue)">${events.length}</div><div class="lbl">总日程</div></div>
                <div class="glass-panel stat"><div class="num" style="color:var(--accent-teal)">${upcoming.length}</div><div class="lbl">即将到来</div></div>
                <div class="glass-panel stat"><div class="num" style="color:var(--accent-orange)">${todayEvents.length}</div><div class="lbl">今日</div></div>
                <div class="glass-panel stat"><div class="num" style="color:var(--accent-purple)">${[...new Set(events.map(e=>e.calendar))].length}</div><div class="lbl">日历分类</div></div>
            `;

            const groups = {};
            for (const ev of events) {
                const dayKey = ev.start.split("T")[0];
                if (!groups[dayKey]) groups[dayKey] = [];
                groups[dayKey].push(ev);
            }

            const dayKeys = Object.keys(groups).sort();
            if (dayKeys.length === 0) {
                document.getElementById("timeline").innerHTML =
                    '<div class="loading-state"><p>暂无日程 📭</p></div>';
                return;
            }

            const today = new Date().toISOString().split("T")[0];
            let html = "";

            for (const dayKey of dayKeys) {
                const dayEvents = groups[dayKey];
                const date = new Date(dayKey + "T00:00:00");
                const isToday = dayKey === today;
                const dayNames = ["周日","周一","周二","周三","周四","周五","周六"];
                const dayName = dayNames[date.getDay()];
                const monthDay = `${date.getMonth()+1}/${date.getDate()}`;

                const mainCal = dayEvents[0].calendar || "";
                const dotColor = getDotColor(mainCal);

                let pillLabel, pillBg, pillColor;
                if (isToday) {
                    pillLabel = `今天 ${monthDay}`;
                    pillBg = "rgba(109,140,255,0.2)";
                    pillColor = "var(--accent-blue)";
                } else {
                    pillLabel = `${monthDay} ${dayName}`;
                    pillBg = "rgba(255,255,255,0.06)";
                    pillColor = "var(--text-primary)";
                }

                const calSet = [...new Set(dayEvents.map(e => e.calendar).filter(Boolean))];
                const calTags = calSet.slice(0, 2).map(c => {
                    const s = getCalStyle(c);
                    return `<span style="font-size:0.68rem;padding:1px 8px;border-radius:10px;background:${s.pill};color:${s.dot}">${c}</span>`;
                }).join("");

                html += `<div class="day-group">
                    <div class="rail">
                        <div class="rdot" style="background:${dotColor}"></div>
                        <div class="rline"></div>
                    </div>
                    <div class="day-content">
                        <div class="day-header">
                            <span class="day-pill" style="background:${pillBg};color:${pillColor}">${pillLabel}</span>
                            <span class="day-label">${calTags}</span>
                        </div>`;

                for (const ev of dayEvents) {
                    const calName = ev.calendar || "";
                    const calStyle = getCalStyle(calName);
                    const isAllDay = ev.all_day;
                    const timeStr = isAllDay ? "全天" : (ev.start_readable || "").split(" ")[1] || "";
                    const hasDesc = ev.description && ev.description.trim();

                    html += `<div class="glass-light event-card">
                        <div class="event-main">
                            <div class="event-title">${escHtml(ev.summary)}</div>
                            ${hasDesc ? `<div class="event-detail">${escHtml(ev.description.substring(0, 80))}${ev.description.length>80?'…':''}</div>` : ""}
                        </div>
                        <span class="event-time">${timeStr}</span>
                        <span class="event-cal" style="background:${calStyle.pill};color:${calStyle.dot}">${escHtml(calName)}</span>
                    </div>`;
                }

                html += `</div></div>`;
            }

            document.getElementById("timeline").innerHTML = html;
        }

        function formatTime(iso) {
            const d = new Date(iso);
            const now = new Date();
            const diff = now - d;
            if (diff < 60000) return "刚刚";
            if (diff < 3600000) return `${Math.floor(diff/60000)} 分钟前`;
            return d.toLocaleString("zh-CN", { month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit" });
        }

        function escHtml(s) {
            const div = document.createElement("div");
            div.textContent = s || "";
            return div.innerHTML;
        }

        /* ═══════════════════════════════════════
           新增日程
           ═══════════════════════════════════════ */
        function openModal() {
            document.getElementById("modal").classList.add("active");
            const t = new Date();
            t.setHours(t.getHours() + 1, 0, 0, 0);
            document.getElementById("ev-start").value = t.toISOString().slice(0, 16);
            t.setHours(t.getHours() + 1);
            document.getElementById("ev-end").value = t.toISOString().slice(0, 16);
            document.getElementById("ev-summary").focus();
        }

        function closeModal() {
            document.getElementById("modal").classList.remove("active");
            document.getElementById("ev-summary").value = "";
            document.getElementById("ev-desc").value = "";
        }

        async function submitEvent() {
            const summary = document.getElementById("ev-summary").value.trim();
            const start = document.getElementById("ev-start").value;
            const end = document.getElementById("ev-end").value;
            const calendar = document.getElementById("ev-calendar").value;
            const desc = document.getElementById("ev-desc").value.trim();

            if (!summary || !start) {
                showToast("请填写标题和开始时间");
                return;
            }

            const payload = { summary, start_date: start, description: desc, calendar };

            try {
                const resp = await fetch("/api/calendar", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });
                const data = await resp.json();

                if (data.status === "received") {
                    closeModal();
                    if (data.message.includes("Leon")) {
                        showToast("📋 请将日程信息发给 Leon 帮你添加");
                    } else {
                        showToast("✅ 日程已提交！");
                    }
                } else {
                    showToast("❌ " + (data.error || "提交失败"));
                }
            } catch (err) {
                showToast("❌ 网络错误，请重试");
            }
        }

        function showToast(msg) {
            const t = document.getElementById("toast");
            t.textContent = msg;
            t.classList.add("show");
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.classList.remove("show"), 3000);
        }

        // ESC to close modal
        document.addEventListener("keydown", e => {
            if (e.key === "Escape") closeModal();
        });
        document.getElementById("modal").addEventListener("click", function(e) {
            if (e.target === this) closeModal();
        });

        // Initial load
        loadCalendar();
    </script>
</body>
</html>
