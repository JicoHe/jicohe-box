<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日程 | Jico He.</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --card: #1a1a1a;
            --border: #2a2a2a;
            --text: #e0e0e0;
            --muted: #888;
            --accent: #e10600;
            --radius: 12px;
            --red: #e10600;
            --orange: #ff8700;
            --purple: #7b2ff7;
            --green: #00d2be;
            --blue: #3b82f6;
            --yellow: #eab308;
            --nav-bg: rgba(15,15,15,0.85);
        }
        [data-theme="light"] {
            --bg: #f5f5f5;
            --card: #ffffff;
            --border: #e0e0e0;
            --text: #1a1a1a;
            --muted: #666;
            --accent: #d40000;
            --nav-bg: rgba(255,255,255,0.9);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Nav */
        nav {
            display:flex; justify-content:space-between; align-items:center;
            padding:1.2rem 2rem; border-bottom:1px solid var(--border);
            backdrop-filter:blur(20px); position:sticky; top:0; z-index:100;
            background:var(--nav-bg);
        }
        .logo { font-weight:700; font-size:1.2rem; }
        .nav-right { display:flex; gap:0.5rem; align-items:center; }
        .nav-right a, .nav-right button {
            text-decoration:none; color:var(--muted); font-size:0.9rem;
            padding:0.4rem 0.8rem; border-radius:6px; transition:all 0.2s;
            cursor:pointer; border:none; background:none; font-family:inherit;
        }
        .nav-right a:hover, .nav-right button:hover { color:var(--text); background:var(--border); }
        .theme-btn { font-size:1.1rem !important; }

        /* Main */
        main { max-width:820px; margin:0 auto; padding:2rem; }

        /* Header */
        .header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:2rem; flex-wrap:wrap; gap:1rem; }
        .header h1 { font-size:1.8rem; font-weight:800; letter-spacing:-0.5px; }
        .header h1 span { color:var(--accent); }
        .meta { color:var(--muted); font-size:0.85rem; margin-top:0.25rem; }

        /* Add Button */
        .btn-add {
            padding:0.65rem 1.4rem; border:none; border-radius:8px;
            background:var(--accent); color:white; font-weight:600; font-size:0.9rem;
            cursor:pointer; font-family:inherit; transition:all 0.2s;
        }
        .btn-add:hover { opacity:0.9; transform:translateY(-1px); }
        .btn-refresh {
            padding:0.65rem 1.2rem; border:1px solid var(--border); border-radius:8px;
            background:var(--card); color:var(--text); font-weight:500; font-size:0.9rem;
            cursor:pointer; font-family:inherit; transition:all 0.2s;
        }
        .btn-refresh:hover { border-color:var(--muted); }

        /* Stats */
        .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:0.75rem; margin-bottom:2rem; }
        .stat {
            background:var(--card); border:1px solid var(--border);
            border-radius:var(--radius); padding:1rem; text-align:center;
        }
        .stat .num { font-size:1.6rem; font-weight:700; }
        .stat .lbl { font-size:0.75rem; color:var(--muted); margin-top:0.25rem; }

        /* Timeline */
        .day-group { display:flex; gap:14px; margin-bottom:0; }
        .rail { display:flex; flex-direction:column; align-items:center; width:14px; flex-shrink:0; }
        .rdot { width:12px; height:12px; border-radius:50%; flex-shrink:0; margin-top:6px; }
        .rline { flex:1; width:2px; background:var(--border); margin-top:4px; min-height:20px; }
        .day-content { flex:1; padding-bottom:0.5rem; }
        .day-header { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
        .day-pill {
            font-size:0.8rem; font-weight:600; padding:3px 12px; border-radius:20px;
            white-space:nowrap; letter-spacing:-0.2px;
        }
        .day-label { font-size:0.8rem; color:var(--muted); }

        .event-card {
            background:var(--card); border:1px solid var(--border);
            border-radius:8px; padding:10px 14px; margin-bottom:6px;
            transition:all 0.15s; cursor:default;
            display:flex; justify-content:space-between; align-items:center; gap:12px;
        }
        .event-card:hover { border-color:var(--muted); }
        .event-main { flex:1; min-width:0; }
        .event-title { font-size:0.95rem; font-weight:500; }
        .event-detail { font-size:0.8rem; color:var(--muted); margin-top:2px; }
        .event-time { font-size:0.85rem; color:var(--muted); white-space:nowrap; flex-shrink:0; }
        .event-cal {
            font-size:0.7rem; padding:2px 8px; border-radius:10px; white-space:nowrap;
            flex-shrink:0; font-weight:500;
        }

        /* Loading */
        .loading { text-align:center; padding:4rem 2rem; color:var(--muted); }
        .spinner { display:inline-block; width:24px; height:24px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; margin-bottom:1rem; }
        @keyframes spin { to { transform:rotate(360deg); } }

        /* Modal */
        .modal-overlay {
            display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7);
            z-index:200; align-items:center; justify-content:center;
        }
        .modal-overlay.active { display:flex; }
        .modal {
            background:var(--card); border:1px solid var(--border);
            border-radius:var(--radius); padding:2rem; width:90%; max-width:460px;
        }
        .modal h2 { font-size:1.3rem; margin-bottom:1.5rem; }
        .form-group { margin-bottom:1rem; }
        .form-group label { display:block; font-size:0.85rem; color:var(--muted); margin-bottom:0.35rem; }
        .form-group input, .form-group textarea, .form-group select {
            width:100%; padding:0.7rem 0.9rem; background:var(--bg);
            border:1px solid var(--border); border-radius:8px; color:var(--text);
            font-size:0.95rem; font-family:inherit;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline:none; border-color:var(--accent);
        }
        .form-row { display:flex; gap:0.75rem; }
        .form-row .form-group { flex:1; }
        .btn-submit {
            width:100%; padding:0.8rem; border:none; border-radius:8px;
            background:var(--accent); color:white; font-weight:600; font-size:1rem;
            cursor:pointer; font-family:inherit; margin-top:0.5rem;
        }
        .btn-cancel {
            width:100%; padding:0.6rem; border:1px solid var(--border); border-radius:8px;
            background:transparent; color:var(--muted); font-size:0.9rem;
            cursor:pointer; font-family:inherit; margin-top:0.5rem;
        }

        /* Toast */
        .toast {
            position:fixed; bottom:2rem; left:50%; transform:translateX(-50%);
            background:var(--green); color:black; padding:0.8rem 1.5rem;
            border-radius:8px; font-weight:600; font-size:0.9rem;
            z-index:300; opacity:0; transition:opacity 0.3s;
            pointer-events:none;
        }
        .toast.show { opacity:1; }

        /* Footer */
        footer { text-align:center; padding:3rem 2rem; color:var(--muted); font-size:0.85rem; border-top:1px solid var(--border); margin-top:3rem; }

        /* Responsive */
        @media (max-width:640px) {
            nav { padding:1rem; }
            main { padding:1rem; }
            .stats { grid-template-columns:repeat(2,1fr); }
            .header h1 { font-size:1.4rem; }
            .event-cal { display:none; }
            .form-row { flex-direction:column; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo"><a href="/" style="color:inherit;text-decoration:none;">Jico He.</a></div>
        <div class="nav-right">
            <button class="theme-btn" onclick="toggleTheme()" title="切换深色/浅色模式" id="theme-btn">🌙</button>
            <a href="/">← 首页</a>
        </div>
    </nav>

    <main>
        <div class="header">
            <div>
                <h1>📅 日程<span>时间线</span></h1>
                <div class="meta" id="update-time">同步中…</div>
            </div>
            <div style="display:flex;gap:0.5rem;">
                <button class="btn-refresh" onclick="loadCalendar()" title="刷新日程数据">🔄 刷新</button>
                <button class="btn-add" onclick="openModal()">+ 新增日程</button>
            </div>
        </div>

        <div class="stats" id="stats"></div>

        <div id="timeline"><div class="loading"><div class="spinner"></div><p>加载日程中…</p></div></div>
    </main>

    <footer>© 2026 Jico He. · 日程数据来自 iCloud 日历 · 由 Cloudflare Pages 驱动</footer>

    <!-- 新增日程 Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h2>📋 新增日程</h2>
            <div class="form-group">
                <label>日程标题 *</label>
                <input type="text" id="ev-summary" placeholder="例如：团队会议">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>开始时间 *</label>
                    <input type="datetime-local" id="ev-start">
                </div>
                <div class="form-group">
                    <label>结束时间</label>
                    <input type="datetime-local" id="ev-end">
                </div>
            </div>
            <div class="form-group">
                <label>日历分类</label>
                <select id="ev-calendar">
                    <option value="">自动</option>
                    <option value="工作">工作</option>
                    <option value="Home">Home</option>
                    <option value="课程表">课程表</option>
                    <option value="自我">自我</option>
                    <option value="家庭">家庭</option>
                    <option value="考试">考试</option>
                </select>
            </div>
            <div class="form-group">
                <label>备注</label>
                <textarea id="ev-desc" rows="2" placeholder="可选"></textarea>
            </div>
            <button class="btn-submit" onclick="submitEvent()">提交日程</button>
            <button class="btn-cancel" onclick="closeModal()">取消</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ═══════════════════════════════════════
        //  日历颜色映射
        // ═══════════════════════════════════════
        const CAL_COLORS = {
            "工作":      { bg:"#FF383C20", dot:"#FF383CFF", pill:"#FF383C15" },
            "课程表":    { bg:"#83D75420", dot:"#83D754FF", pill:"#83D75415" },
            "考试":      { bg:"#FFCC0020", dot:"#FFCC00FF", pill:"#FFCC0015" },
            "Home":      { bg:"#34AADC20", dot:"#34AADCFF", pill:"#34AADC15" },
            "自我":      { bg:"#FF8D2820", dot:"#FF8D28FF", pill:"#FF8D2815" },
            "家庭":      { bg:"#1BADF820", dot:"#1BADF8", pill:"#1BADF815" },
            "Formula 1": { bg:"#e1060020", dot:"#e10600", pill:"#e1060015" },
            "中国大陆节假日": { bg:"#FF950020", dot:"#FF9500", pill:"#FF950015" },
            "Scheduled Reminders": { bg:"#1BADF820", dot:"#1BADF8", pill:"#1BADF815" },
        };
        const DEFAULT_COLOR = { bg:"#88888820", dot:"#888888", pill:"#88888815" };

        function getCalStyle(name) {
            for (const [key, val] of Object.entries(CAL_COLORS)) {
                if (name && name.includes(key)) return val;
            }
            return DEFAULT_COLOR;
        }

        function getDotColor(name) {
            return getCalStyle(name).dot;
        }

        // ═══════════════════════════════════════
        //  深色/浅色模式
        // ═══════════════════════════════════════
        function getTheme() {
            return localStorage.getItem("theme") || "auto";
        }
        function applyTheme() {
            const theme = getTheme();
            const isDark = theme === "dark" || (theme === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
            document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
            document.getElementById("theme-btn").textContent = isDark ? "🌙" : "☀️";
        }
        function toggleTheme() {
            const current = document.documentElement.getAttribute("data-theme");
            localStorage.setItem("theme", current === "dark" ? "light" : "dark");
            applyTheme();
        }
        applyTheme();
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
            if (getTheme() === "auto") applyTheme();
        });

        // ═══════════════════════════════════════
        //  加载 & 渲染
        // ═══════════════════════════════════════
        async function loadCalendar() {
            try {
                const resp = await fetch("/api/calendar");
                const data = await resp.json();
                render(data);
            } catch (err) {
                document.getElementById("timeline").innerHTML =
                    '<div class="loading"><p>⚠️ 无法加载日程数据</p><p style="font-size:0.8rem;margin-top:0.5rem;">请确保 sync_calendar.py 已在本地运行</p></div>';
            }
        }

        function render(data) {
            const events = data.events || [];
            document.getElementById("update-time").textContent =
                data.updated ? `最后同步: ${formatTime(data.updated)}` : "等待首次同步";

            // 统计
            const now = new Date();
            const todayStr = now.toISOString().split("T")[0];
            const upcoming = events.filter(e => e.start >= now.toISOString());
            const todayEvents = events.filter(e => e.start.startsWith(todayStr));
            document.getElementById("stats").innerHTML = `
                <div class="stat"><div class="num" style="color:var(--accent)">${events.length}</div><div class="lbl">总日程</div></div>
                <div class="stat"><div class="num" style="color:var(--blue)">${upcoming.length}</div><div class="lbl">即将到来</div></div>
                <div class="stat"><div class="num" style="color:var(--orange)">${todayEvents.length}</div><div class="lbl">今日</div></div>
                <div class="stat"><div class="num" style="color:var(--purple)">${[...new Set(events.map(e=>e.calendar))].length}</div><div class="lbl">日历分类</div></div>
            `;

            // 按日期分组
            const groups = {};
            for (const ev of events) {
                const dayKey = ev.start.split("T")[0];
                if (!groups[dayKey]) groups[dayKey] = [];
                groups[dayKey].push(ev);
            }

            const dayKeys = Object.keys(groups).sort();
            if (dayKeys.length === 0) {
                document.getElementById("timeline").innerHTML =
                    '<div class="loading"><p>暂无日程 📭</p></div>';
                return;
            }

            const today = new Date().toISOString().split("T")[0];
            let html = "";

            for (const dayKey of dayKeys) {
                const dayEvents = groups[dayKey];
                const date = new Date(dayKey + "T00:00:00");
                const isToday = dayKey === today;
                const dayNames = ["周日","周一","周二","周三","周四","周五","周六"];
                const dayName = dayNames[date.getDay()];
                const monthDay = `${date.getMonth()+1}/${date.getDate()}`;

                // 用该天第一个事件的日历颜色作为点颜色
                const mainCal = dayEvents[0].calendar || "";
                const dotColor = getDotColor(mainCal);

                // Pill 标签
                let pillLabel, pillBg, pillColor;
                if (isToday) {
                    pillLabel = `今天 ${monthDay}`;
                    pillBg = "#FCEBEB";
                    pillColor = "#A32D2D";
                } else {
                    pillLabel = `${monthDay} ${dayName}`;
                    pillBg = "var(--card)";
                    pillColor = "var(--text)";
                }

                // 日历标签
                const calSet = [...new Set(dayEvents.map(e => e.calendar).filter(Boolean))];
                const calTags = calSet.slice(0, 2).map(c => {
                    const s = getCalStyle(c);
                    return `<span style="font-size:0.7rem;padding:1px 8px;border-radius:10px;background:${s.pill};color:${s.dot}">${c}</span>`;
                }).join("");

                html += `<div class="day-group">
                    <div class="rail">
                        <div class="rdot" style="background:${dotColor}"></div>
                        <div class="rline"></div>
                    </div>
                    <div class="day-content">
                        <div class="day-header">
                            <span class="day-pill" style="background:${pillBg};color:${pillColor}">${pillLabel}</span>
                            <span class="day-label">${calTags}</span>
                        </div>`;

                for (const ev of dayEvents) {
                    const calName = ev.calendar || "";
                    const calStyle = getCalStyle(calName);
                    const isAllDay = ev.all_day;
                    const timeStr = isAllDay ? "全天" : (ev.start_readable || "").split(" ")[1] || "";
                    const hasDesc = ev.description && ev.description.trim();

                    html += `<div class="event-card">
                        <div class="event-main">
                            <div class="event-title">${escHtml(ev.summary)}</div>
                            ${hasDesc ? `<div class="event-detail">${escHtml(ev.description.substring(0, 80))}${ev.description.length>80?'…':''}</div>` : ""}
                        </div>
                        <span class="event-time">${timeStr}</span>
                        <span class="event-cal" style="background:${calStyle.pill};color:${calStyle.dot}">${escHtml(calName)}</span>
                    </div>`;
                }

                html += `</div></div>`;
            }

            document.getElementById("timeline").innerHTML = html;
        }

        function formatTime(iso) {
            const d = new Date(iso);
            const now = new Date();
            const diff = now - d;
            if (diff < 60000) return "刚刚";
            if (diff < 3600000) return `${Math.floor(diff/60000)} 分钟前`;
            return d.toLocaleString("zh-CN", { month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit" });
        }

        function escHtml(s) {
            const div = document.createElement("div");
            div.textContent = s || "";
            return div.innerHTML;
        }

        // ═══════════════════════════════════════
        //  新增日程
        // ═══════════════════════════════════════
        function openModal() {
            document.getElementById("modal").classList.add("active");
            // 默认时间设为一小时后
            const t = new Date();
            t.setHours(t.getHours() + 1, 0, 0, 0);
            document.getElementById("ev-start").value = t.toISOString().slice(0, 16);
            t.setHours(t.getHours() + 1);
            document.getElementById("ev-end").value = t.toISOString().slice(0, 16);
            document.getElementById("ev-summary").focus();
        }

        function closeModal() {
            document.getElementById("modal").classList.remove("active");
            document.getElementById("ev-summary").value = "";
            document.getElementById("ev-desc").value = "";
        }

        async function submitEvent() {
            const summary = document.getElementById("ev-summary").value.trim();
            const start = document.getElementById("ev-start").value;
            const end = document.getElementById("ev-end").value;
            const calendar = document.getElementById("ev-calendar").value;
            const desc = document.getElementById("ev-desc").value.trim();

            if (!summary || !start) {
                showToast("请填写标题和开始时间", "var(--red)");
                return;
            }

            const payload = { summary, start_date: start, description: desc, calendar };

            try {
                const resp = await fetch("/api/calendar", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });
                const data = await resp.json();

                if (data.status === "received") {
                    closeModal();
                    if (data.message.includes("Leon")) {
                        showToast("📋 请将日程信息发给 Leon 帮你添加", "var(--orange)");
                    } else {
                        showToast("✅ 日程已提交！", "var(--green)");
                    }
                } else {
                    showToast("❌ " + (data.error || "提交失败"), "var(--red)");
                }
            } catch (err) {
                showToast("❌ 网络错误，请重试", "var(--red)");
            }
        }

        function showToast(msg, color) {
            const t = document.getElementById("toast");
            t.textContent = msg;
            t.style.background = color || "var(--green)";
            t.classList.add("show");
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.classList.remove("show"), 3000);
        }

        // ═══════════════════════════════════════
        //  键盘快捷键
        // ═══════════════════════════════════════
        document.addEventListener("keydown", (e) => {
            if (document.getElementById("modal").classList.contains("active")) {
                if (e.key === "Escape") closeModal();
                return;
            }
            if (e.key === "n" && !e.ctrlKey && !e.metaKey) {
                e.preventDefault();
                openModal();
            }
            if (e.key === "r" && !e.ctrlKey && !e.metaKey) {
                loadCalendar();
                showToast("🔄 已刷新", "var(--blue)");
            }
        });

        // 点击遮罩关闭
        document.getElementById("modal").addEventListener("click", (e) => {
            if (e.target === document.getElementById("modal")) closeModal();
        });

        // Initial load
        loadCalendar();
        // Auto refresh every 5 minutes
        setInterval(loadCalendar, 300000);
    </script>
</body>
</html>
