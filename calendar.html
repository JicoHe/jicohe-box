<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日程 · Jico He.</title>
    <style>
        :root {
            --bg: #08080f;
            --glass: rgba(20, 20, 35, 0.55);
            --glass-light: rgba(30, 30, 48, 0.30);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-border-hover: rgba(255, 255, 255, 0.12);
            --glass-border-focus: rgba(255, 255, 255, 0.18);
            --text: rgba(255, 255, 255, 0.92);
            --text-secondary: rgba(255, 255, 255, 0.55);
            --text-muted: rgba(255, 255, 255, 0.30);
            --accent: #6d8cff; --accent-2: #a78bfa;
            --accent-teal: #5eead4; --accent-orange: #fb923c;
            --blur: blur(40px) saturate(180%);
            --radius: 18px; --radius-sm: 12px;
            --nav-bg: rgba(8, 8, 15, 0.75);
            --light-brightness: 1;
        }
        [data-theme="light"] {
            --bg: #eef0f4;
            --glass: rgba(255, 255, 255, 0.55);
            --glass-light: rgba(255, 255, 255, 0.40);
            --glass-border: rgba(0, 0, 0, 0.06);
            --glass-border-hover: rgba(0, 0, 0, 0.10);
            --glass-border-focus: rgba(0, 0, 0, 0.15);
            --text: rgba(0, 0, 0, 0.85);
            --text-secondary: rgba(0, 0, 0, 0.50);
            --text-muted: rgba(0, 0, 0, 0.30);
            --accent: #4f5fd4; --accent-2: #7b61c8;
            --accent-teal: #2ea894; --accent-orange: #d97706;
            --nav-bg: rgba(238, 240, 244, 0.75);
            --light-brightness: 0.4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "PingFang SC", sans-serif;
            line-height: 1.6; -webkit-font-smoothing: antialiased;
            min-height: 100vh; position: relative;
        }

        .bg-blobs { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .blob { position: absolute; border-radius: 50%; filter: blur(120px); opacity: calc(0.15 * var(--light-brightness)); animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
        .blob-1 { width: 450px; height: 450px; background: radial-gradient(circle, var(--accent-teal), transparent 70%); top: -10%; left: -10%; animation: f1 25s infinite alternate; }
        .blob-2 { width: 400px; height: 400px; background: radial-gradient(circle, var(--accent-2), transparent 70%); bottom: -15%; right: -10%; animation: f2 28s infinite alternate; }
        @keyframes f1 { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(100px, 60px) scale(1.2); } }
        @keyframes f2 { 0% { transform: translate(0,0) scale(1.1); } 100% { transform: translate(-70px, -80px) scale(0.9); } }

        nav {
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 2rem; background: var(--nav-bg);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--glass-border);
        }
        .nav-name { font-weight: 700; font-size: 1.05rem; }
        .nav-name a { color: inherit; text-decoration: none; }
        .nav-right { display: flex; gap: 0.4rem; align-items: center; }
        .nav-btn { background: none; border: none; font-size: 0.82rem; cursor: pointer; padding: 0.3rem 0.6rem; border-radius: 8px; color: var(--text-secondary); font-family: inherit; transition: all 0.2s; }
        .nav-btn:hover { background: var(--glass-border); color: var(--text); }

        .glass {
            background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--glass-border); border-radius: var(--radius);
            transition: all 0.35s cubic-bezier(0.22,0.61,0.36,1);
        }
        .glass-light { background: var(--glass-light); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); }

        /* Lock Screen */
        #lockscreen {
            position: fixed; inset: 0; z-index: 999;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 1rem;
            background: var(--bg);
        }
        #lockscreen.hidden { display: none; }
        #lockscreen h2 { font-size: 1.2rem; font-weight: 600; }
        .pw-group { display: flex; gap: 0.5rem; }
        .pw-group input { padding: 0.7rem 1rem; background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text); font-size: 0.95rem; outline: none; font-family: inherit; width: 200px; transition: border-color 0.3s; }
        .pw-group input:focus { border-color: var(--glass-border-focus); }
        .pw-group button { padding: 0.7rem 1.2rem; background: rgba(109,140,255,0.12); border: 1px solid rgba(109,140,255,0.2); border-radius: 8px; color: var(--accent); font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.3s; }
        .pw-group button:hover { background: rgba(109,140,255,0.22); }
        .lock-msg { font-size: 0.82rem; min-height: 1.2em; text-align: center; color: var(--text-muted); }
        .lock-msg.error { color: #f87171; }

        #main-content { display: none; }
        #main-content.unlocked { display: block; }

        .container { position: relative; z-index: 2; max-width: 820px; margin: 0 auto; padding: 2rem; }

        .page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
        .page-header h1 { font-size: 1.5rem; font-weight: 700; }
        .update-time { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.3rem; }
        .header-actions { display: flex; gap: 0.5rem; }
        .btn { padding: 0.55rem 1.1rem; background: var(--glass-light); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); color: var(--text); font-size: 0.85rem; cursor: pointer; font-family: inherit; transition: all 0.3s; }
        .btn:hover { border-color: var(--glass-border-hover); }
        .btn-accent { padding: 0.55rem 1.2rem; background: rgba(109,140,255,0.12); border: 1px solid rgba(109,140,255,0.2); color: var(--accent); font-weight: 600; }
        .btn-accent:hover { background: rgba(109,140,255,0.22); }

        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; margin-bottom: 2rem; }
        .stat { padding: 1.2rem; text-align: center; }
        .stat .num { font-size: 1.5rem; font-weight: 700; }
        .stat .lbl { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; }

        .day-group { display: flex; gap: 14px; margin-bottom: 0; }
        .rail { display: flex; flex-direction: column; align-items: center; width: 14px; flex-shrink: 0; }
        .rdot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; margin-top: 6px; box-shadow: 0 0 12px currentColor; }
        .rline { flex: 1; width: 1.5px; background: rgba(128,128,128,0.15); margin-top: 4px; min-height: 20px; }
        .day-content { flex: 1; padding-bottom: 0.5rem; }
        .day-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .day-pill { font-size: 0.78rem; font-weight: 600; padding: 3px 14px; border-radius: 20px; white-space: nowrap; }
        .day-label { font-size: 0.78rem; color: var(--text-muted); }

        .event-card { padding: 10px 14px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; gap: 12px; cursor: default; border-radius: var(--radius-sm); }
        .event-main { flex: 1; min-width: 0; }
        .event-title { font-size: 0.92rem; font-weight: 500; }
        .event-detail { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
        .event-time { font-size: 0.82rem; color: var(--text-secondary); white-space: nowrap; flex-shrink: 0; }
        .event-cal { font-size: 0.68rem; padding: 2px 8px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; font-weight: 500; }

        .loading-state { text-align: center; padding: 4rem 2rem; color: var(--text-muted); }
        .spinner { display: inline-block; width: 24px; height: 24px; border: 2px solid rgba(128,128,128,0.15); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .modal-overlay { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(4,4,8,0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { width: 90%; max-width: 460px; padding: 2rem; animation: modal-in 0.35s cubic-bezier(0.22,0.61,0.36,1); }
        @keyframes modal-in { from { opacity: 0; transform: scale(0.95) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .modal h2 { font-size: 1.2rem; font-weight: 600; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.82rem; color: var(--text-secondary); margin-bottom: 0.35rem; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 0.7rem 0.9rem; background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); color: var(--text); font-size: 0.92rem; font-family: inherit; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: var(--glass-border-focus); }
        .form-row { display: flex; gap: 0.75rem; }
        .form-row .form-group { flex: 1; }
        .btn-submit { width: 100%; padding: 0.8rem; background: rgba(109,140,255,0.12); border: 1px solid rgba(109,140,255,0.2); border-radius: var(--radius-sm); color: var(--accent); font-weight: 600; font-size: 0.95rem; cursor: pointer; font-family: inherit; margin-top: 0.5rem; }
        .btn-cancel { width: 100%; padding: 0.6rem; background: transparent; border: 1px solid var(--glass-border); border-radius: var(--radius-sm); color: var(--text-muted); font-size: 0.88rem; cursor: pointer; font-family: inherit; margin-top: 0.5rem; }

        .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); padding: 0.8rem 1.5rem; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.88rem; z-index: 300; opacity: 0; transition: opacity 0.3s; pointer-events: none; background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border: 1px solid var(--glass-border); color: var(--text); }
        .toast.show { opacity: 1; }

        footer { text-align: center; padding: 3rem 2rem; color: var(--text-muted); font-size: 0.82rem; }

        @media (max-width: 640px) {
            nav { padding: 1rem; } .container { padding: 1rem; }
            .stats { grid-template-columns: repeat(2, 1fr); }
            .page-header h1 { font-size: 1.3rem; }
            .form-row { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="bg-blobs"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>

    <!-- Lock Screen -->
    <div id="lockscreen">
        <h2>日程 · 请输入密码</h2>
        <div class="pw-group">
            <input type="password" id="pw-input" placeholder="输入密码…" autofocus autocomplete="off">
            <button onclick="verifyPassword()">解锁</button>
        </div>
        <div class="lock-msg" id="lock-msg"></div>
    </div>

    <div id="main-content">
        <nav>
            <div class="nav-name"><a href="/">Jico He</a></div>
            <div class="nav-right">
                <button class="nav-btn" onclick="toggleTheme()" id="theme-btn">🌙</button>
                <a href="/" style="color:var(--text-secondary);text-decoration:none;font-size:0.85rem;">← 首页</a>
            </div>
        </nav>
        <div class="container">
            <div class="page-header">
                <div>
                    <h1>日程时间线</h1>
                    <div class="update-time" id="update-time">同步中…</div>
                </div>
                <div class="header-actions">
                    <button class="btn" onclick="loadCalendar()">刷新</button>
                    <button class="btn btn-accent" onclick="openModal()">+ 新增</button>
                </div>
            </div>
            <div class="stats" id="stats"></div>
            <div id="timeline"><div class="loading-state"><div class="spinner"></div><p>加载日程中…</p></div></div>
        </div>
        <footer>Jico He · iCloud 日历 · Cloudflare Pages</footer>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal">
        <div class="glass modal">
            <h2>新增日程</h2>
            <div class="form-group"><label>标题 *</label><input type="text" id="ev-summary" placeholder="例如：团队会议"></div>
            <div class="form-row">
                <div class="form-group"><label>开始 *</label><input type="datetime-local" id="ev-start"></div>
                <div class="form-group"><label>结束</label><input type="datetime-local" id="ev-end"></div>
            </div>
            <div class="form-group"><label>日历分类</label>
                <select id="ev-calendar">
                    <option value="">自动</option><option>工作</option><option>Home</option><option>课程表</option>
                    <option>自我</option><option>家庭</option><option>考试</option>
                </select>
            </div>
            <div class="form-group"><label>备注</label><textarea id="ev-desc" rows="2" placeholder="可选"></textarea></div>
            <button class="btn-submit" onclick="submitEvent()">提交</button>
            <button class="btn-cancel" onclick="closeModal()">取消</button>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        /* Theme */
        function getTheme() { return localStorage.getItem("theme") || "auto"; }
        function applyTheme() {
            const isDark = getTheme() === "dark" || (getTheme() === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
            document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
            document.getElementById("theme-btn").textContent = isDark ? "🌙" : "☀️";
        }
        function toggleTheme() { localStorage.setItem("theme", document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark"); applyTheme(); }
        applyTheme();

        /* Lock */
        function isUnlocked() { return sessionStorage.getItem("cal_unlocked") === "true"; }
        async function verifyPassword() {
            const pw = document.getElementById("pw-input").value, msg = document.getElementById("lock-msg");
            if (!pw) { msg.textContent = "请输入密码"; msg.className = "lock-msg error"; return; }
            msg.textContent = "验证中…"; msg.className = "lock-msg";
            try {
                const r = await fetch("/api/password", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({password:pw}) });
                const d = await r.json();
                if (d.status === "ok") {
                    sessionStorage.setItem("cal_unlocked", "true");
                    document.getElementById("lockscreen").classList.add("hidden");
                    document.getElementById("main-content").classList.add("unlocked");
                    loadCalendar();
                } else {
                    msg.textContent = d.error?.includes("not configured") ? "后台未配置密码" : "密码错误";
                    msg.className = "lock-msg error";
                    document.getElementById("pw-input").value = ""; document.getElementById("pw-input").focus();
                }
            } catch(e) { msg.textContent = "请求失败"; msg.className = "lock-msg error"; }
        }
        document.getElementById("pw-input").addEventListener("keydown", e => { if (e.key==="Enter") verifyPassword(); });
        if (isUnlocked()) { document.getElementById("lockscreen").classList.add("hidden"); document.getElementById("main-content").classList.add("unlocked"); loadCalendar(); }

        /* Calendar colors */
        const CC = {
            "工作":{dot:"#FF6B6B",pill:"rgba(255,107,107,0.15)"},"课程表":{dot:"#83D754",pill:"rgba(131,215,84,0.15)"},
            "考试":{dot:"#FFCC00",pill:"rgba(255,204,0,0.15)"},"Home":{dot:"#34AADC",pill:"rgba(52,170,220,0.15)"},
            "自我":{dot:"#FF9500",pill:"rgba(255,149,0,0.15)"},"家庭":{dot:"#5BC0EB",pill:"rgba(91,192,235,0.15)"},
            "Formula 1":{dot:"#e10600",pill:"rgba(225,6,0,0.15)"},"中国大陆节假日":{dot:"#FF9500",pill:"rgba(255,149,0,0.15)"},
        }, DC = {dot:"#888",pill:"rgba(136,136,136,0.15)"};
        function cs(n) { for(let[k,v]of Object.entries(CC)) if(n&&n.includes(k)) return v; return DC; }
        function dc(n) { return cs(n).dot; }

        async function loadCalendar() {
            try {
                const r = await fetch("/api/calendar"); const d = await r.json();
                document.getElementById("update-time").textContent = d.updated ? `最后同步: ${ft(d.updated)}` : "等待首次同步";
                const ev = d.events||[], n=new Date(), ts=n.toISOString().split("T")[0];
                const up=ev.filter(e=>e.start>=n.toISOString()), td=ev.filter(e=>e.start.startsWith(ts));
                document.getElementById("stats").innerHTML =
                    `<div class="glass-light stat"><div class="num" style="color:var(--accent)">${ev.length}</div><div class="lbl">总日程</div></div>
                    <div class="glass-light stat"><div class="num" style="color:var(--accent-teal)">${up.length}</div><div class="lbl">即将</div></div>
                    <div class="glass-light stat"><div class="num" style="color:var(--accent-orange)">${td.length}</div><div class="lbl">今日</div></div>
                    <div class="glass-light stat"><div class="num" style="color:var(--accent-2)">${[...new Set(ev.map(e=>e.calendar))].length}</div><div class="lbl">分类</div></div>`;
                const g={}; for(const e of ev){const k=e.start.split("T")[0];if(!g[k])g[k]=[];g[k].push(e);}
                const ks=Object.keys(g).sort();
                if(!ks.length){document.getElementById("timeline").innerHTML='<div class="loading-state"><p>暂无日程</p></div>';return;}
                const dn=["周日","周一","周二","周三","周四","周五","周六"]; let h="";
                for(const dk of ks){
                    const de=g[dk], dt=new Date(dk+"T00:00:00"), it=dk===ts;
                    const md=`${dt.getMonth()+1}/${dt.getDate()}`, mc=de[0].calendar||"";
                    let pl,pb,pc;
                    if(it){pl=`今天 ${md}`;pb="rgba(109,140,255,0.2)";pc="var(--accent)";}
                    else{pl=`${md} ${dn[dt.getDay()]}`;pb="rgba(128,128,128,0.1)";pc="var(--text)";}
                    const ct=[...new Set(de.map(e=>e.calendar).filter(Boolean))].slice(0,2).map(c=>`<span style="font-size:0.68rem;padding:1px 8px;border-radius:10px;background:${cs(c).pill};color:${cs(c).dot}">${c}</span>`).join("");
                    h+=`<div class="day-group"><div class="rail"><div class="rdot" style="background:${dc(mc)}"></div><div class="rline"></div></div><div class="day-content"><div class="day-header"><span class="day-pill" style="background:${pb};color:${pc}">${pl}</span><span class="day-label">${ct}</span></div>`;
                    for(const e of de){
                        const cn=e.calendar||"",st=cs(cn),ts2=e.all_day?"全天":(e.start_readable||"").split(" ")[1]||"",hd=e.description&&e.description.trim();
                        h+=`<div class="glass-light event-card"><div class="event-main"><div class="event-title">${eh(e.summary)}</div>${hd?`<div class="event-detail">${eh(e.description.substring(0,80))}${e.description.length>80?'…':''}</div>`:""}</div><span class="event-time">${ts2}</span><span class="event-cal" style="background:${st.pill};color:${st.dot}">${eh(cn)}</span></div>`;
                    }
                    h+=`</div></div>`;
                }
                document.getElementById("timeline").innerHTML=h;
            } catch { document.getElementById("timeline").innerHTML='<div class="loading-state"><p>⚠️ 无法加载</p></div>'; }
        }
        function ft(iso){const d=new Date(iso),n=new Date(),df=n-d;if(df<6e4)return"刚刚";if(df<36e5)return`${Math.floor(df/6e4)} 分钟前`;return d.toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});}
        function eh(s){const d=document.createElement("div");d.textContent=s||"";return d.innerHTML;}

        function openModal(){document.getElementById("modal").classList.add("active");const t=new Date();t.setHours(t.getHours()+1,0,0,0);document.getElementById("ev-start").value=t.toISOString().slice(0,16);t.setHours(t.getHours()+1);document.getElementById("ev-end").value=t.toISOString().slice(0,16);document.getElementById("ev-summary").focus();}
        function closeModal(){document.getElementById("modal").classList.remove("active");document.getElementById("ev-summary").value="";document.getElementById("ev-desc").value="";}
        async function submitEvent(){
            const sm=document.getElementById("ev-summary").value.trim(),st=document.getElementById("ev-start").value,en=document.getElementById("ev-end").value,cl=document.getElementById("ev-calendar").value,ds=document.getElementById("ev-desc").value.trim();
            if(!sm||!st){stt("请填写标题和开始时间");return;}
            try{const r=await fetch("/api/calendar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({summary:sm,start_date:st,end_date:en,description:ds,calendar:cl})});const d=await r.json();closeModal();stt(d.status==="received"?(d.message.includes("Leon")?"📋 请发给 Leon":"✅ 已提交"):"❌ "+(d.error||"失败"));}catch{stt("❌ 网络错误");}
        }
        function stt(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),3000);}
        document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
        document.getElementById("modal").addEventListener("click",function(e){if(e.target===this)closeModal();});
    </script>
</body>
</html>
