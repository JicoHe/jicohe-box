<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jico He. | 个人门户</title>
    <style>
        :root {
            --bg: #0f0f0f; --card: #1a1a1a; --border: #2a2a2a;
            --text: #e0e0e0; --muted: #888; --accent: #6366f1;
            --accent-glow: rgba(99,102,241,0.3); --green: #22c55e;
            --red: #ef4444; --radius: 12px; --nav-bg: rgba(15,15,15,0.85);
        }
        [data-theme="light"] {
            --bg: #f5f5f5; --card: #ffffff; --border: #e0e0e0;
            --text: #1a1a1a; --muted: #666; --accent: #4f46e5;
            --accent-glow: rgba(79,70,229,0.15); --green: #16a34a;
            --red: #dc2626; --nav-bg: rgba(255,255,255,0.9);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:var(--bg); color:var(--text);
            font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
            line-height:1.6; min-height:100vh;
        }

        /* ── 锁屏 ── */
        #lockscreen {
            position:fixed; inset:0; z-index:9999; background:var(--bg);
            display:flex; align-items:center; justify-content:center;
            flex-direction:column; gap:1.2rem;
        }
        #lockscreen.hidden { display:none; }
        #lockscreen .lock-icon { font-size:2.5rem; }
        #lockscreen h2 { font-size:1.3rem; font-weight:600; }
        #lockscreen .pw-group { display:flex; gap:0.5rem; }
        #lockscreen .pw-group input {
            padding:0.7rem 1rem; background:var(--card); border:1px solid var(--border);
            border-radius:8px; color:var(--text); font-size:1rem; width:200px;
            font-family:inherit; outline:none;
        }
        #lockscreen .pw-group input:focus { border-color:var(--accent); }
        #lockscreen .pw-group button {
            padding:0.7rem 1.2rem; background:var(--accent); color:white;
            border:none; border-radius:8px; font-weight:600; font-size:0.95rem;
            cursor:pointer; font-family:inherit;
        }
        #lockscreen .pw-group button:hover { opacity:0.9; }
        #lockscreen .lock-msg { font-size:0.85rem; min-height:1.2em; text-align:center; }
        #lockscreen .lock-msg.error { color:var(--red); }

        /* ── 主内容 ── */
        #main-content { display:none; }
        #main-content.unlocked { display:block; }

        /* ── 导航 ── */
        nav {
            display:flex; justify-content:space-between; align-items:center;
            padding:1.2rem 2rem; border-bottom:1px solid var(--border);
            backdrop-filter:blur(20px); position:sticky; top:0; z-index:100;
            background:var(--nav-bg);
        }
        .logo { font-weight:700; font-size:1.2rem; letter-spacing:-0.5px; }
        .nav-right { display:flex; gap:0.5rem; align-items:center; }
        .nav-right a, .nav-right button {
            text-decoration:none; color:var(--muted); font-size:0.9rem;
            padding:0.4rem 0.8rem; border-radius:6px; transition:all 0.2s;
            cursor:pointer; border:none; background:none; font-family:inherit;
        }
        .nav-right a:hover, .nav-right button:hover { color:var(--text); background:var(--border); }

        main { max-width:860px; margin:0 auto; padding:3rem 2rem; }
        .hero { text-align:center; padding:4rem 0 3rem; }
        .hero h1 { font-size:3rem; font-weight:800; letter-spacing:-1px; margin-bottom:0.5rem; }
        .hero h1 span { color:var(--accent); }
        .hero p { color:var(--muted); font-size:1.15rem; max-width:500px; margin:0 auto 2rem; }

        .services { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:1rem; margin-bottom:3rem; }
        .card {
            background:var(--card); border:1px solid var(--border);
            border-radius:var(--radius); padding:1.5rem; transition:all 0.25s;
            text-decoration:none; color:var(--text); display:block;
        }
        .card:hover { border-color:var(--accent); box-shadow:0 0 30px var(--accent-glow); transform:translateY(-2px); }
        .card .icon { font-size:1.8rem; margin-bottom:0.8rem; }
        .card h3 { font-size:1.1rem; margin-bottom:0.4rem; }
        .card p { color:var(--muted); font-size:0.88rem; }

        .token-balance { font-size:1.8rem; font-weight:700; color:var(--accent); margin:0.3rem 0; }
        .token-meta { font-size:0.8rem; color:var(--muted); }
        .refresh-btn {
            background:none; border:none; color:var(--muted);
            cursor:pointer; font-size:0.8rem; padding:0.2rem; border-radius:4px;
        }
        .refresh-btn:hover { color:var(--text); }

        footer { text-align:center; padding:4rem 2rem; color:var(--muted); font-size:0.85rem; border-top:1px solid var(--border); margin-top:4rem; }

        @media (max-width:640px) {
            .hero h1 { font-size:2rem; }
            .services { grid-template-columns:1fr; }
            nav { padding:1rem; }
        }
    </style>
</head>
<body>

    <!-- ═══════════ 锁屏 ═══════════ -->
    <div id="lockscreen">
        <div class="lock-icon">🔐</div>
        <h2>请输入密码</h2>
        <div class="pw-group">
            <input type="password" id="pw-input" placeholder="输入密码…" autofocus>
            <button onclick="verifyPassword()">解锁</button>
        </div>
        <div class="lock-msg" id="lock-msg"></div>
    </div>

    <!-- ═══════════ 主内容 ═══════════ -->
    <div id="main-content">
        <nav>
            <div class="logo">Jico He.</div>
            <div class="nav-right">
                <button onclick="toggleTheme()" title="切换深色/浅色" id="theme-btn" style="font-size:1.1rem;">🌙</button>
                <button onclick="lockSite()" title="锁定" style="font-size:0.85rem;">🔒</button>
            </div>
        </nav>

        <main>
            <section class="hero">
                <h1>微小的改变，<br><span>惊人的结果。</span></h1>
                <p>跨学科视角探索思维模型、效率工具与自动化技术。</p>
            </section>

            <section class="services">
                <a href="https://ha.jicohe-box.cn" target="_blank" class="card">
                    <div class="icon">🏠</div><h3>智能家居 HAOS</h3><p>Home Assistant 控制面板 →</p>
                </a>
                <div class="card" id="deepseek-card">
                    <div class="icon">🤖</div>
                    <h3>DeepSeek API <button class="refresh-btn" onclick="fetchBalance()" title="刷新">↻</button></h3>
                    <div class="token-balance" id="ds-balance">—</div>
                    <div class="token-meta" id="ds-meta">加载中…</div>
                </div>
                <a href="/calendar" class="card">
                    <div class="icon">📅</div><h3>日程时间线</h3><p>iCloud 日历同步 · F1 主题 →</p>
                </a>
                <a href="https://code.jicohe-box.cn" target="_blank" class="card">
                    <div class="icon">💻</div><h3>Code Editor</h3><p>VS Code 在线编辑器 →</p>
                </a>
            </section>
        </main>
        <footer>© 2026 Jico He. · 由 Cloudflare Pages 驱动</footer>
    </div>

    <script>
        // Theme
        function getTheme() { return localStorage.getItem("theme") || "auto"; }
        function applyTheme() {
            const isDark = getTheme() === "dark" || (getTheme() === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
            document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
            const btn = document.getElementById("theme-btn");
            if (btn) btn.textContent = isDark ? "🌙" : "☀️";
        }
        function toggleTheme() {
            localStorage.setItem("theme", document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
            applyTheme();
        }
        applyTheme();
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (getTheme() === "auto") applyTheme(); });

        // Lock
        function isUnlocked() { return sessionStorage.getItem("site_unlocked") === "true"; }
        function lockSite() {
            sessionStorage.removeItem("site_unlocked");
            document.getElementById("lockscreen").classList.remove("hidden");
            document.getElementById("main-content").classList.remove("unlocked");
            document.getElementById("pw-input").value = "";
            document.getElementById("pw-input").focus();
        }
        function unlockSite() {
            sessionStorage.setItem("site_unlocked", "true");
            document.getElementById("lockscreen").classList.add("hidden");
            document.getElementById("main-content").classList.add("unlocked");
            fetchBalance();
        }

        async function verifyPassword() {
            const pw = document.getElementById("pw-input").value;
            const msg = document.getElementById("lock-msg");
            if (!pw) { msg.textContent = "请输入密码"; msg.className = "lock-msg error"; return; }
            msg.textContent = "";
            msg.className = "lock-msg";

            try {
                const resp = await fetch("/api/auth/password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password: pw })
                });
                const data = await resp.json();
                if (data.status === "ok") {
                    unlockSite();
                } else {
                    msg.textContent = "密码错误";
                    msg.className = "lock-msg error";
                    document.getElementById("pw-input").value = "";
                    document.getElementById("pw-input").focus();
                }
            } catch {
                msg.textContent = "网络错误，请重试";
                msg.className = "lock-msg error";
            }
        }

        // Enter key
        document.getElementById("pw-input").addEventListener("keydown", e => { if (e.key === "Enter") verifyPassword(); });

        // DeepSeek
        async function fetchBalance() {
            const b = document.getElementById("ds-balance"), m = document.getElementById("ds-meta");
            if (!b) return;
            try {
                const r = await fetch("/api/deepseek");
                if (!r.ok) throw new Error();
                const d = await r.json();
                const bal = parseFloat(d.balance_infos?.[0]?.total_balance ?? d.total_balance ?? 0);
                b.textContent = `¥${bal.toFixed(2)}`; m.textContent = "DeepSeek API 余额";
            } catch { b.textContent = "—"; m.textContent = "余额查询失败"; }
        }

        // Init
        if (isUnlocked()) {
            unlockSite();
        } else {
            document.getElementById("lockscreen").classList.remove("hidden");
            document.getElementById("pw-input").focus();
        }
        setInterval(fetchBalance, 60000);
    </script>
</body>
</html>
