<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 Face ID</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f0f; color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; text-align: center;
        }
        .card {
            background: #1a1a1a; border: 1px solid #2a2a2a;
            border-radius: 16px; padding: 2.5rem 2rem;
            max-width: 400px; width: 90%;
        }
        .icon { font-size: 3rem; margin-bottom: 1rem; }
        .btn {
            display: inline-block; margin-top: 1.5rem;
            padding: 0.9rem 2.5rem; background: #6366f1; color: white;
            border: none; border-radius: 10px; font-size: 1.05rem;
            cursor: pointer; font-weight: 600;
        }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        pre {
            background: #111; border-radius: 8px; padding: 1rem;
            margin-top: 1.5rem; font-size: 0.75rem; text-align: left;
            overflow-x: auto; color: #22c55e; border: 1px solid #2a2a2a;
        }
        .step { color: #888; font-size: 0.85rem; margin-top: 0.5rem; }
        .success { color: #22c55e; }
        .error { color: #ef4444; }
        .spinner {
            width: 40px; height: 40px; border: 3px solid #2a2a2a;
            border-top-color: #6366f1; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <div id="step1">
            <div class="icon">😀</div>
            <h2>首次设置 Face ID</h2>
            <p class="step">在 iPhone 上完成此步骤，之后扫码即可用面容解锁管理面板。</p>
            <button class="btn" id="registerBtn" onclick="register()">注册 Face ID</button>
            <p class="step" style="margin-top:0.5rem;">仅需一次，iPhone 会弹出面容识别</p>
        </div>
        <div id="step2" style="display:none;">
            <div class="spinner"></div>
            <p>正在注册，请看着 iPhone 完成面容识别…</p>
        </div>
        <div id="step3" style="display:none;">
            <div class="icon success">✅</div>
            <h3>注册成功！</h3>
            <p class="step">请将下方信息复制到 Cloudflare 环境变量 <code>WEBAUTHN_CREDENTIAL</code>：</p>
            <pre id="credentialJson"></pre>
            <button class="btn" onclick="copyCredential()" id="copyBtn">📋 复制</button>
            <p class="step" id="copyMsg"></p>
        </div>
        <div id="stepError" style="display:none;">
            <div class="icon error">✗</div>
            <h3>注册失败</h3>
            <p class="error" id="errorMsg"></p>
            <button class="btn" onclick="location.reload()">重试</button>
        </div>
    </div>

    <script>
        async function register() {
            const btn = document.getElementById("registerBtn");
            btn.disabled = true;
            document.getElementById("step1").style.display = "none";
            document.getElementById("step2").style.display = "block";
            document.getElementById("stepError").style.display = "none";

            try {
                const challengeBytes = new Uint8Array(32);
                crypto.getRandomValues(challengeBytes);

                const publicKeyCredentialCreationOptions = {
                    challenge: challengeBytes,
                    rp: {
                        name: "JicoBox",
                        id: "jicohe-box.cn"
                    },
                    user: {
                        id: new Uint8Array(16),
                        name: "jico@jicohe-box.cn",
                        displayName: "Jico He"
                    },
                    pubKeyCredParams: [{
                        type: "public-key",
                        alg: -7  // ES256 (P-256)
                    }],
                    timeout: 60000,
                    attestation: "none",
                    authenticatorSelection: {
                        authenticatorAttachment: "platform",
                        userVerification: "required",
                        residentKey: "required"
                    }
                };

                const credential = await navigator.credentials.create({
                    publicKey: publicKeyCredentialCreationOptions
                });

                // 序列化 credential 用于存储
                const exportCred = {
                    id: credential.id,
                    publicKey: b64url(credential.response.getPublicKey()),
                    transports: credential.response.getTransports?.() || []
                };

                document.getElementById("step2").style.display = "none";
                document.getElementById("step3").style.display = "block";
                document.getElementById("credentialJson").textContent = JSON.stringify(exportCred);

            } catch (err) {
                document.getElementById("step2").style.display = "none";
                document.getElementById("stepError").style.display = "block";
                document.getElementById("errorMsg").textContent = err.message || "未知错误";
                console.error("WebAuthn registration failed:", err);
            }
        }

        function b64url(buf) {
            return btoa(String.fromCharCode(...new Uint8Array(buf)))
                .replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
        }

        async function copyCredential() {
            const text = document.getElementById("credentialJson").textContent;
            try {
                await navigator.clipboard.writeText(text);
                document.getElementById("copyMsg").textContent = "已复制！去 Cloudflare → Settings → Environment Variables 添加 WEBAUTHN_CREDENTIAL";
                document.getElementById("copyMsg").className = "step success";
            } catch {
                document.getElementById("copyMsg").textContent = "复制失败，请手动选择并复制上方文本";
                document.getElementById("copyMsg").className = "step error";
            }
        }
    </script>
</body>
</html>
