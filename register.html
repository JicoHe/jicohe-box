<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 Face ID · Jico He</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #111111;
            --text-secondary: #555555;
            --text-muted: #999999;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border: #e5e7eb;
            --card-bg: #ffffff;
            --radius: 8px;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
            --font-mono: "SF Mono", "Fira Code", "Menlo", monospace;
        }
        [data-theme="dark"] {
            --bg: #0d0d0d;
            --text: #e5e5e5;
            --text-secondary: #888888;
            --text-muted: #555555;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --border: #2a2a2a;
            --card-bg: #141414;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            font-size: 15px;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 1.5rem;
            -webkit-font-smoothing: antialiased;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2.5rem 2rem;
            max-width: 420px; width: 100%;
            text-align: center;
        }

        .icon { font-size: 2.5rem; margin-bottom: 1rem; }
        .step { color: var(--text-secondary); font-size: 0.84rem; margin-top: 0.4rem; line-height: 1.5; }
        .success { color: #16a34a; }
        .error { color: #dc2626; }

        .btn {
            display: inline-block; margin-top: 1.2rem;
            padding: 0.7rem 1.8rem;
            background: var(--accent); border: none;
            border-radius: var(--radius);
            color: #fff; font-size: 0.92rem;
            cursor: pointer; font-weight: 600; font-family: inherit;
            transition: background 0.15s ease, transform 0.1s ease;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        pre {
            background: var(--bg); border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem; margin-top: 1rem;
            font-size: 0.7rem; text-align: left;
            overflow-x: auto; color: var(--accent);
            font-family: var(--font-mono);
        }

        .spinner {
            width: 32px; height: 32px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .back-link {
            display: inline-block; margin-top: 1.2rem;
            font-size: 0.82rem; color: var(--text-muted); text-decoration: none;
            transition: color 0.15s ease;
        }
        .back-link:hover { color: var(--text-secondary); }

        @media (prefers-color-scheme: dark) {
            :root { --bg: #0d0d0d; --text: #e5e5e5; --text-secondary: #888888;
                    --text-muted: #555555; --accent: #3b82f6; --accent-hover: #60a5fa;
                    --border: #2a2a2a; --card-bg: #141414; }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Step 1: Register -->
        <div id="step1">
            <div class="icon">&#128100;</div>
            <h2 style="font-size:1.1rem;font-weight:600;">首次设置 Face ID</h2>
            <p class="step">在 iPhone 上完成此步骤，之后扫码即可用面容解锁管理面板。</p>
            <button class="btn" id="registerBtn" onclick="register()">注册 Face ID</button>
            <p class="step" style="font-size:0.76rem;color:var(--text-muted);">仅需一次，iPhone 会弹出面容识别</p>
        </div>

        <!-- Step 2: Registering -->
        <div id="step2" style="display:none;">
            <div class="spinner"></div>
            <p>正在注册，请看着 iPhone 完成面容识别…</p>
        </div>

        <!-- Step 3: Success -->
        <div id="step3" style="display:none;">
            <div class="icon success">&#10003;</div>
            <h3 style="font-size:1.05rem;">注册成功！</h3>
            <p class="step">请将下方信息复制到 Cloudflare 环境变量 <code style="background:var(--bg);border:1px solid var(--border);padding:1px 6px;border-radius:4px;">WEBAUTHN_CREDENTIAL</code>：</p>
            <pre id="credentialJson"></pre>
            <button class="btn" onclick="copyCredential()" id="copyBtn">复制</button>
            <p class="step" id="copyMsg" style="min-height:1.2em;"></p>
        </div>

        <!-- Step Error -->
        <div id="stepError" style="display:none;">
            <div class="icon error">&#10007;</div>
            <h3 style="font-size:1.05rem;">注册失败</h3>
            <p class="error" id="errorMsg" style="margin-top:0.4rem;"></p>
            <button class="btn" onclick="location.reload()">重试</button>
        </div>
    </div>

    <script>
        async function register() {
            const btn = document.getElementById("registerBtn");
            btn.disabled = true;
            document.getElementById("step1").style.display = "none";
            document.getElementById("step2").style.display = "block";
            document.getElementById("stepError").style.display = "none";

            try {
                const challengeBytes = new Uint8Array(32);
                crypto.getRandomValues(challengeBytes);

                const publicKeyCredentialCreationOptions = {
                    challenge: challengeBytes,
                    rp: { name: "个人主义", id: "jicohe-box.cn" },
                    user: {
                        id: new Uint8Array(16),
                        name: "jico@jicohe-box.cn",
                        displayName: "Jico He"
                    },
                    pubKeyCredParams: [{ type: "public-key", alg: -7 }],
                    timeout: 60000,
                    attestation: "none",
                    authenticatorSelection: {
                        authenticatorAttachment: "platform",
                        userVerification: "required",
                        residentKey: "required"
                    }
                };

                const credential = await navigator.credentials.create({
                    publicKey: publicKeyCredentialCreationOptions
                });

                const exportCred = {
                    id: credential.id,
                    publicKey: b64url(credential.response.getPublicKey()),
                    transports: credential.response.getTransports?.() || []
                };

                document.getElementById("step2").style.display = "none";
                document.getElementById("step3").style.display = "block";
                document.getElementById("credentialJson").textContent = JSON.stringify(exportCred);

            } catch (err) {
                document.getElementById("step2").style.display = "none";
                document.getElementById("stepError").style.display = "block";
                document.getElementById("errorMsg").textContent = err.message || "未知错误";
                console.error("WebAuthn registration failed:", err);
            }
        }

        function b64url(buf) {
            return btoa(String.fromCharCode(...new Uint8Array(buf)))
                .replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
        }

        async function copyCredential() {
            const text = document.getElementById("credentialJson").textContent;
            try {
                await navigator.clipboard.writeText(text);
                document.getElementById("copyMsg").textContent = "已复制！去 Cloudflare \u2192 Settings \u2192 Environment Variables 添加 WEBAUTHN_CREDENTIAL";
                document.getElementById("copyMsg").className = "step success";
            } catch {
                document.getElementById("copyMsg").textContent = "复制失败，请手动选择并复制上方文本";
                document.getElementById("copyMsg").className = "step error";
            }
        }
    </script>
</body>
</html>
