<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证 · 个人主义</title>
    <style>
        :root {
            --bg-deep: #08080f;
            --glass-medium: rgba(22, 22, 36, 0.45);
            --glass-light: rgba(30, 30, 48, 0.30);
            --glass-border: rgba(255, 255, 255, 0.06);
            --text-primary: rgba(255, 255, 255, 0.92);
            --text-secondary: rgba(255, 255, 255, 0.55);
            --text-muted: rgba(255, 255, 255, 0.30);
            --accent-blue: #6d8cff;
            --accent-purple: #a78bfa;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --blur-medium: blur(40px) saturate(180%);
            --radius: 20px;
            --radius-sm: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-deep);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "PingFang SC", sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 1.5rem;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        /* 背景光斑 */
        .bg-blobs {
            position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
        }
        .blob {
            position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.15;
            animation-timing-function: ease-in-out; animation-iteration-count: infinite;
        }
        .blob-1 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, var(--accent-purple), transparent 70%);
            top: -10%; right: -15%;
            animation: float-1 22s infinite alternate;
        }
        .blob-2 {
            width: 350px; height: 350px;
            background: radial-gradient(circle, var(--accent-blue), transparent 70%);
            bottom: -10%; left: -10%;
            animation: float-2 26s infinite alternate;
        }
        @keyframes float-1 {
            0% { transform: translate(0,0) scale(1); }
            100% { transform: translate(-50px, 60px) scale(1.2); }
        }
        @keyframes float-2 {
            0% { transform: translate(0,0) scale(0.9); }
            100% { transform: translate(50px, -40px) scale(1.1); }
        }

        .grain {
            position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        .glass-card {
            position: relative; z-index: 2;
            background: var(--glass-medium);
            backdrop-filter: var(--blur-medium);
            -webkit-backdrop-filter: var(--blur-medium);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 2.5rem 2rem;
            max-width: 380px; width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .glass-card::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 50%);
            border-radius: inherit; pointer-events: none;
        }

        .status-icon { font-size: 2.5rem; margin-bottom: 1rem; }
        .title { font-size: 1.15rem; font-weight: 600; margin-bottom: 0.5rem; }
        .subtitle { font-size: 0.85rem; color: var(--text-secondary); }
        .result { margin-top: 1rem; font-size: 0.9rem; word-break: break-word; }
        .result.success { color: var(--accent-green); }
        .result.error { color: var(--accent-red); }
        .debug {
            font-size: 0.72rem; color: var(--text-muted);
            margin-top: 0.75rem; padding-top: 0.75rem;
            border-top: 1px solid var(--glass-border);
        }

        .spinner {
            width: 36px; height: 36px;
            border: 2.5px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .back-link {
            display: inline-block; margin-top: 1.5rem;
            font-size: 0.82rem; color: var(--text-muted); text-decoration: none;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--text-secondary); }
    </style>
</head>
<body>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    <div class="grain"></div>

    <div class="glass-card" id="status">
        <div class="spinner"></div>
        <p class="subtitle">正在进行面容识别…</p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const sessionId = params.get("s");

        function show(msg, cls, debug) {
            let html = '';
            if (cls === 'success') {
                html += '<div class="status-icon">✅</div>';
            } else if (cls === 'error') {
                html += '<div class="status-icon">✗</div>';
            }
            html += `<div class="result ${cls || ''}">${msg}</div>`;
            if (debug) html += `<div class="debug">${debug}</div>`;
            html += '<a href="/" class="back-link">← 返回首页</a>';
            document.getElementById("status").innerHTML = html;
        }

        function b64urlDecode(str) {
            if (!str || typeof str !== "string") throw new Error("credential ID 为空");
            str = str.trim().replace(/-/g, "+").replace(/_/g, "/");
            while (str.length % 4) str += "=";
            const binary = atob(str);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes;
        }

        function b64urlEncode(buffer) {
            const bytes = new Uint8Array(buffer);
            let binary = "";
            for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
            return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
        }

        async function run() {
            if (!sessionId) { show("无效链接", "error"); return; }

            try {
                const cr = await fetch(`/api/auth/challenge?session=${sessionId}`);
                if (!cr.ok) throw new Error("服务器返回 " + cr.status);
                const cd = await cr.json();

                let allowCredentials = [];
                if (cd.allowCredentials && cd.allowCredentials.length > 0) {
                    allowCredentials = cd.allowCredentials.map(ac => ({
                        id: b64urlDecode(ac.id),
                        type: ac.type
                    }));
                } else {
                    throw new Error("未找到已绑定的 Face ID，请先在 iPhone 上注册");
                }

                const credential = await navigator.credentials.get({
                    publicKey: {
                        challenge: b64urlDecode(cd.challenge),
                        rpId: cd.rpId,
                        allowCredentials,
                        timeout: cd.timeout,
                        userVerification: "required"
                    }
                });

                const vr = await fetch("/api/auth/verify", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        session: sessionId,
                        credential: {
                            id: credential.id,
                            response: {
                                authenticatorData: b64urlEncode(credential.response.authenticatorData),
                                clientDataJSON: b64urlEncode(credential.response.clientDataJSON),
                                signature: b64urlEncode(credential.response.signature),
                                userHandle: credential.response.userHandle
                                    ? b64urlEncode(credential.response.userHandle) : null
                            }
                        }
                    })
                });

                const vd = await vr.json();
                if (vd.status === "authenticated") {
                    show("已验证，电脑端已解锁", "success");
                } else {
                    show("验证失败: " + (vd.error || "未知"), "error");
                }

            } catch (err) {
                if (err.name === "NotAllowedError" || String(err).includes("cancel")) {
                    show("面容识别已取消", "error");
                } else if (String(err).includes("credential ID")) {
                    show(err.message, "error", "请用 iPhone 访问注册页面重新绑定 Face ID");
                } else {
                    show("出错了", "error", err.message || "未知错误");
                }
            }
        }

        run();
    </script>
</body>
</html>
