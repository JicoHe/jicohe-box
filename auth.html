<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证中…</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f0f;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 3rem 2rem;
            max-width: 360px;
            width: 90%;
        }
        .spinner {
            width: 48px; height: 48px;
            border: 3px solid #2a2a2a;
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .icon { font-size: 3rem; margin-bottom: 1rem; }
        .success { color: #22c55e; }
        .error { color: #ef4444; }
        .btn {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.8rem 2rem;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }
        .btn:hover { opacity: 0.9; }
        p { color: #888; font-size: 0.9rem; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <div class="card">
        <div id="loading">
            <div class="spinner"></div>
            <p>正在验证身份…</p>
        </div>
        <div id="result" style="display:none;"></div>
    </div>

    <script>
        async function verify() {
            const params = new URLSearchParams(window.location.search);
            const session = params.get("s");
            const challenge = params.get("c");

            const resultEl = document.getElementById("result");
            const loadingEl = document.getElementById("loading");

            if (!session || !challenge) {
                loadingEl.style.display = "none";
                resultEl.style.display = "block";
                resultEl.innerHTML = '<div class="icon error">✗</div><h3>无效的验证链接</h3><p>请重新扫描二维码</p>';
                return;
            }

            try {
                const resp = await fetch("/api/auth", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ session, challenge })
                });

                const data = await resp.json();

                loadingEl.style.display = "none";
                resultEl.style.display = "block";

                if (data.status === "authenticated") {
                    resultEl.innerHTML = '<div class="icon success">✓</div><h3>验证成功</h3><p>电脑端将自动解锁管理面板</p>';
                } else {
                    resultEl.innerHTML = '<div class="icon error">✗</div><h3>验证失败</h3><p>验证码错误或已过期，请重新扫描</p>';
                    resultEl.innerHTML += '<a href="https://www.jicohe-box.cn" class="btn">返回首页</a>';
                }
            } catch (err) {
                loadingEl.style.display = "none";
                resultEl.style.display = "block";
                resultEl.innerHTML = '<div class="icon error">✗</div><h3>网络错误</h3><p>请检查网络后重试</p>';
            }
        }

        verify();
    </script>
</body>
</html>
