<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证</title>
    <style>
        :root {
            --bg: #0f0f0f; --text: #e0e0e0; --border: #2a2a2a;
            --accent: #6366f1; --green: #22c55e; --red: #ef4444;
        }
        [data-theme="light"] {
            --bg: #f5f5f5; --text: #1a1a1a; --border: #e0e0e0;
            --accent: #4f46e5; --green: #16a34a; --red: #dc2626;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:var(--bg); color:var(--text);
            font-family:-apple-system,BlinkMacSystemFont,sans-serif;
            display:flex; align-items:center; justify-content:center;
            min-height:100vh; padding:1rem;
        }
        .status { text-align:center; max-width:360px; }
        .spinner {
            width:40px; height:40px; border:3px solid var(--border);
            border-top-color:var(--accent); border-radius:50%;
            animation:spin 0.8s linear infinite; margin:0 auto 1rem;
        }
        @keyframes spin { to { transform:rotate(360deg); } }
        .result { font-size:1.1rem; word-break:break-word; }
        .success { color:var(--green); }
        .error { color:var(--red); }
        .debug { font-size:0.75rem; color:var(--border); margin-top:0.5rem; }
    </style>
</head>
<body>
    <div class="status" id="status">
        <div class="spinner"></div>
        <div class="result">正在进行面容识别…</div>
    </div>

    <script>
        (function() {
            const theme = localStorage.getItem("theme") || "auto";
            const isDark = theme === "dark" || (theme === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
            document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
        })();

        const params = new URLSearchParams(window.location.search);
        const sessionId = params.get("s");

        function show(msg, cls, debug) {
            let html = `<div class="result ${cls || ''}">${msg}</div>`;
            if (debug) html += `<div class="debug">${debug}</div>`;
            document.getElementById("status").innerHTML = html;
        }

        // Robust base64url decode — trims whitespace, handles edge cases
        function b64urlDecode(str) {
            if (!str || typeof str !== "string") throw new Error("credential ID 为空");
            str = str.trim().replace(/-/g, "+").replace(/_/g, "/");
            while (str.length % 4) str += "=";
            if (!/^[A-Za-z0-9+/=]+$/.test(str)) throw new Error("credential ID 格式异常，请重新绑定 Face ID");
            const binary = atob(str);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes;
        }

        function b64urlEncode(buffer) {
            const bytes = new Uint8Array(buffer);
            let binary = "";
            for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
            return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
        }

        async function run() {
            if (!sessionId) { show("无效链接", "error"); return; }

            try {
                // Step 1: 获取 challenge
                const cr = await fetch(`/api/auth/challenge?session=${sessionId}`);
                if (!cr.ok) {
                    const errText = await cr.text().catch(() => "");
                    throw new Error("服务器返回 " + cr.status + (errText ? ": " + errText.substring(0, 80) : ""));
                }
                const cd = await cr.json();

                // Step 2: 解析 allowCredentials（加固解码）
                let allowCredentials = [];
                if (cd.allowCredentials && cd.allowCredentials.length > 0) {
                    allowCredentials = cd.allowCredentials.map(ac => ({
                        id: b64urlDecode(ac.id),
                        type: ac.type
                    }));
                } else {
                    throw new Error("未找到已绑定的 Face ID，请先在 iPhone 上注册");
                }

                // Step 3: Face ID
                const credential = await navigator.credentials.get({
                    publicKey: {
                        challenge: b64urlDecode(cd.challenge),
                        rpId: cd.rpId,
                        allowCredentials,
                        timeout: cd.timeout,
                        userVerification: "required"
                    }
                });

                // Step 4: 发送验证
                const vr = await fetch("/api/auth/verify", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        session: sessionId,
                        credential: {
                            id: credential.id,
                            response: {
                                authenticatorData: b64urlEncode(credential.response.authenticatorData),
                                clientDataJSON: b64urlEncode(credential.response.clientDataJSON),
                                signature: b64urlEncode(credential.response.signature),
                                userHandle: credential.response.userHandle
                                    ? b64urlEncode(credential.response.userHandle) : null
                            }
                        }
                    })
                });

                const vd = await vr.json();
                if (vd.status === "authenticated") {
                    show("✅ 已验证，电脑端已解锁", "success");
                } else {
                    show("验证失败: " + (vd.error || "未知"), "error");
                }

            } catch (err) {
                if (err.name === "NotAllowedError" || String(err).includes("cancel")) {
                    show("面容识别已取消", "error");
                } else if (String(err).includes("credential ID")) {
                    show(err.message, "error", "请用 iPhone 访问注册页面重新绑定 Face ID");
                } else {
                    show("出错了", "error", err.message || "未知错误");
                }
            }
        }

        run();
    </script>
</body>
</html>
