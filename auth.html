<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f0f; color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh;
        }
        .status { text-align: center; padding: 2rem; }
        .spinner {
            width: 40px; height: 40px; border: 3px solid #2a2a2a;
            border-top-color: #6366f1; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .result { font-size: 1.1rem; }
        .success { color: #22c55e; }
        .error { color: #ef4444; }
    </style>
</head>
<body>
    <div class="status" id="status">
        <div class="spinner"></div>
        <div class="result">正在进行面容识别…</div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const sessionId = params.get("s");

        function show(msg, cls) {
            document.getElementById("status").innerHTML =
                `<div class="result ${cls || ''}">${msg}</div>`;
        }

        function b64url(buf) {
            return btoa(String.fromCharCode(...new Uint8Array(buf)))
                .replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
        }

        function b64urlToBytes(str) {
            str = str.replace(/-/g, "+").replace(/_/g, "/");
            while (str.length % 4) str += "=";
            return Uint8Array.from(atob(str), c => c.charCodeAt(0));
        }

        async function run() {
            if (!sessionId) {
                show("无效链接", "error");
                return;
            }

            try {
                // 1) 获取 challenge
                const cr = await fetch(`/api/auth/challenge?session=${sessionId}`);
                if (!cr.ok) throw new Error("服务器错误");
                const cd = await cr.json();

                // 2) Face ID — 直接弹，不等用户操作
                const allowCredentials = cd.allowCredentials.map(ac => ({
                    id: b64urlToBytes(ac.id),
                    type: ac.type
                }));

                const credential = await navigator.credentials.get({
                    publicKey: {
                        challenge: b64urlToBytes(cd.challenge),
                        rpId: cd.rpId,
                        allowCredentials: allowCredentials,
                        timeout: cd.timeout,
                        userVerification: "required"
                    }
                });

                // 3) 发送验证
                const vr = await fetch("/api/auth/verify", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        session: sessionId,
                        credential: {
                            id: credential.id,
                            response: {
                                authenticatorData: b64url(credential.response.authenticatorData),
                                clientDataJSON: b64url(credential.response.clientDataJSON),
                                signature: b64url(credential.response.signature),
                                userHandle: credential.response.userHandle
                                    ? b64url(credential.response.userHandle) : null
                            }
                        }
                    })
                });

                const vd = await vr.json();
                if (vd.status === "authenticated") {
                    show("✅ 已验证，电脑端已解锁", "success");
                } else {
                    show("验证失败: " + (vd.error || "未知"), "error");
                }

            } catch (err) {
                if (err.name === "NotAllowedError" || String(err).includes("cancel")) {
                    show("面容识别已取消", "error");
                } else {
                    show("错误: " + (err.message || "未知"), "error");
                }
            }
        }

        run();
    </script>
</body>
</html>
