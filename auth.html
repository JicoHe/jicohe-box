<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证 · Jico He</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #111111;
            --text-secondary: #555555;
            --text-muted: #999999;
            --accent: #2563eb;
            --border: #e5e7eb;
            --card-bg: #ffffff;
            --radius: 8px;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
        }
        [data-theme="dark"] {
            --bg: #0d0d0d;
            --text: #e5e5e5;
            --text-secondary: #888888;
            --text-muted: #555555;
            --accent: #3b82f6;
            --border: #2a2a2a;
            --card-bg: #141414;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            font-size: 15px;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 1.5rem;
            -webkit-font-smoothing: antialiased;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2.5rem 2rem;
            max-width: 380px; width: 100%;
            text-align: center;
        }

        .status-icon { font-size: 2.5rem; margin-bottom: 1rem; }
        .title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.4rem; }
        .subtitle { font-size: 0.85rem; color: var(--text-secondary); }
        .result { margin-top: 0.8rem; font-size: 0.9rem; word-break: break-word; }
        .result.success { color: #16a34a; }
        .result.error { color: #dc2626; }
        .debug {
            font-size: 0.72rem; color: var(--text-muted);
            margin-top: 0.75rem; padding-top: 0.75rem;
            border-top: 1px solid var(--border);
        }
        .spinner {
            width: 32px; height: 32px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .back-link {
            display: inline-block; margin-top: 1.5rem;
            font-size: 0.82rem; color: var(--text-muted); text-decoration: none;
            transition: color 0.15s ease;
        }
        .back-link:hover { color: var(--text-secondary); }

        /* Auto theme detection */
        @media (prefers-color-scheme: dark) {
            :root { --bg: #0d0d0d; --text: #e5e5e5; --text-secondary: #888888;
                    --text-muted: #555555; --accent: #3b82f6; --border: #2a2a2a;
                    --card-bg: #141414; }
        }
    </style>
</head>
<body>
    <div class="card" id="status">
        <div class="spinner"></div>
        <p class="subtitle">正在进行面容识别…</p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const sessionId = params.get("s");

        function show(msg, cls, debug) {
            let html = '';
            if (cls === 'success') {
                html += '<div class="status-icon">&#10003;</div>';
            } else if (cls === 'error') {
                html += '<div class="status-icon">&#10007;</div>';
            }
            html += '<div class="result ' + (cls || '') + '">' + msg + '</div>';
            if (debug) html += '<div class="debug">' + debug + '</div>';
            html += '<a href="/" class="back-link">&#8592; 返回首页</a>';
            document.getElementById("status").innerHTML = html;
        }

        function b64urlDecode(str) {
            if (!str || typeof str !== "string") throw new Error("credential ID 为空");
            str = str.trim().replace(/-/g, "+").replace(/_/g, "/");
            while (str.length % 4) str += "=";
            const binary = atob(str);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes;
        }

        function b64urlEncode(buffer) {
            const bytes = new Uint8Array(buffer);
            let binary = "";
            for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
            return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
        }

        async function run() {
            if (!sessionId) { show("无效链接", "error"); return; }

            try {
                const cr = await fetch("/api/auth/challenge?session=" + sessionId);
                if (!cr.ok) throw new Error("服务器返回 " + cr.status);
                const cd = await cr.json();

                let allowCredentials = [];
                if (cd.allowCredentials && cd.allowCredentials.length > 0) {
                    allowCredentials = cd.allowCredentials.map(ac => ({
                        id: b64urlDecode(ac.id),
                        type: ac.type
                    }));
                } else {
                    throw new Error("未找到已绑定的 Face ID，请先在 iPhone 上注册");
                }

                const credential = await navigator.credentials.get({
                    publicKey: {
                        challenge: b64urlDecode(cd.challenge),
                        rpId: cd.rpId,
                        allowCredentials,
                        timeout: cd.timeout,
                        userVerification: "required"
                    }
                });

                const vr = await fetch("/api/auth/verify", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        session: sessionId,
                        credential: {
                            id: credential.id,
                            response: {
                                authenticatorData: b64urlEncode(credential.response.authenticatorData),
                                clientDataJSON: b64urlEncode(credential.response.clientDataJSON),
                                signature: b64urlEncode(credential.response.signature),
                                userHandle: credential.response.userHandle
                                    ? b64urlEncode(credential.response.userHandle) : null
                            }
                        }
                    })
                });

                const vd = await vr.json();
                if (vd.status === "authenticated") {
                    show("已验证，电脑端已解锁", "success");
                } else {
                    show("验证失败: " + (vd.error || "未知"), "error");
                }

            } catch (err) {
                if (err.name === "NotAllowedError" || String(err).includes("cancel")) {
                    show("面容识别已取消", "error");
                } else if (String(err).includes("credential ID")) {
                    show(err.message, "error", "请用 iPhone 访问注册页面重新绑定 Face ID");
                } else {
                    show("出错了", "error", err.message || "未知错误");
                }
            }
        }

        run();
    </script>
</body>
</html>
